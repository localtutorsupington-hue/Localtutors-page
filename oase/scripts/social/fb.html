<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<title>Oase Facebook-kaart: te-gemaklik</title>
<link rel="stylesheet" href="fonts.css">
<style>
  body { width: 1080px; height: 1350px; }
  .kaart { width: 1080px; height: 1350px; padding: 104px 104px 96px; }
  .etiket { font-size: 34px; }
  h1 { font-size: 132px; line-height: 1.02; margin-top: 88px; max-width: 860px; }
  .voet { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; border-top: 2px solid var(--hair); padding-top: 40px; }
  .merk { font-size: 96px; }
  .leuse { font-size: 44px; text-align: right; }
  .s1 { width: 560px; height: 560px; right: -210px; top: -230px; background: var(--roos); }
  .s2 { width: 120px; height: 120px; right: 104px; top: 250px; background: var(--goud); }
  .kaart > *:not(.sirkel) { position: relative; z-index: 1; }
</style>
</head>
<body>
  <div class="kaart">
    <span class="sirkel s1"></span><span class="sirkel s2"></span>
    <span class="etiket"><i></i>Beweeg</span>
    <h1>Die gevaarlikste plek is nie onder nie. Dis <span class="saam"><span class="pill">gemaklik</span>.</span></h1>
    <div class="voet">
      <span class="merk">Oase<i></i></span>
      <span class="leuse">'n Plek om asem te skep.</span>
    </div>
  </div>
</body>
</html>
