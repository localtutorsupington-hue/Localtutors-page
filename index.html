olor: #1F2933; font-family: 'Nunito Sans'; overscroll-behavior-y: contain; -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  a { color: #1F3D73; }\n  a:hover { color: #111111; }\n  button { font-family: 'Nunito Sans'; cursor: pointer; }\n  input { font-family: 'Nunito Sans'; }\n  @keyframes dcRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }\n  #screen { animation: dcRise 420ms cubic-bezier(0.32,0.72,0,1) both; }\n  @media (prefers-reduced-motion: reduce) {\n    #screen { animation: none !important; }\n    button, a, input { transition-duration: 0.001ms !important; }\n    #dc-progress { display: none; }\n  }\n  @media (prefers-reduced-motion: no-preference) {\n    html { scroll-behavior: smooth; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<main style=\"min-height: 100vh; min-height: 100dvh\">\n<div id=\"dc-progress\" aria-hidden=\"true\" style=\"position: fixed; top: 0; left: 0; right: 0; height: 2px; background: #1F3D73; transform: scaleX(0); transform-origin: 0 50%; z-index: 40; pointer-events: none; transition: transform 120ms linear\"><\u002Fdiv>\n\n<sc-if value=\"{{ isLanding }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n  <header style=\"border-bottom: 1px solid rgba(17,17,17,0.08); background: rgba(242,240,235,0.88); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 20\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px\">\n      <div style=\"display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap\">\n        <span style=\"display: inline-flex; align-items: center; gap: 10px\">\n          <img src=\"5ff5c12e-03e9-4a64-973e-cf37aeaae68f\" alt=\"\" width=\"34\" height=\"32\" style=\"display: block; height: 32px; width: auto\">\n          <img src=\"76cd5418-2adc-4eb9-8620-c48b49f86aa3\" alt=\"localtutors\" style=\"display: block; height: 19px; width: auto\">\n        <\u002Fspan>\n        <span style=\"font-size: 13px; color: #4B565F\">Leesassessering vir Graad 3 tot 12<\u002Fspan>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ startQuiz }}\" style=\"min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; background: #111111; color: #F2F0EB; font-size: 15px; font-weight: 700; transition: transform 400ms cubic-bezier(0.32,0.72,0,1), background 400ms cubic-bezier(0.32,0.72,0,1)\" style-hover=\"background: #1F2933\" style-active=\"transform: translateY(1px)\" style-focus=\"outline: 3px solid #1F3D73; outline-offset: 2px\">Begin die assessering<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"max-width: 1120px; margin: 0 auto; padding: 64px 20px 0\">\n    <div id=\"hero\" style=\"max-width: 760px\">\n      <div>\n        <div style=\"display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #8CC8E8; color: #111111; font-size: 13px; font-weight: 700\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n          Gratis assessering, Graad 3 tot 12\n        <\u002Fdiv>\n        <h1 style=\"font-family: 'Manrope'; font-weight: 800; font-size: clamp(33px, 6.6vw, 52px); line-height: 1.06; letter-spacing: -0.03em; color: #111111; margin: 20px 0 0; max-width: 680px\">Word huiswerktyd elke aand 'n {{ rotator }} oor lees?<\u002Fh1>\n        <p style=\"font-size: 19px; line-height: 1.55; color: #1F2933; margin: 24px 0 0; max-width: 560px; text-wrap: pretty\">Antwoord 15 vinnige vrae en vind uit waarom jou kind dalk sukkel, en wat om werklik daaraan te doen.<\u002Fp>\n        <p style=\"font-size: 16px; line-height: 1.6; color: #4B565F; margin: 12px 0 0; max-width: 520px; text-wrap: pretty\">Jy antwoord, gebaseer op hoe jou kind by die huis lees en op skool vaar. Neem sowat 3 minute, heeltemal gratis.<\u002Fp>\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-top: 32px; flex-wrap: wrap\">\n          <button type=\"button\" sc-camel-on-click=\"{{ startQuiz }}\" style=\"display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 26px 0 30px; border: 0; border-radius: 999px; background: #111111; color: #F2F0EB; font-size: 17px; font-weight: 700; transition: transform 400ms cubic-bezier(0.32,0.72,0,1), background 400ms cubic-bezier(0.32,0.72,0,1)\" style-hover=\"background: #1F2933\" style-active=\"transform: translateY(1px)\" style-focus=\"outline: 3px solid #1F3D73; outline-offset: 2px\">\n            Ja, ek wil die assessering doen\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8CC8E8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><line x1=\"4\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"13 6 19 12 13 18\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fbutton>\n          <span style=\"font-size: 14px; color: #4B565F\">Geen registrasie nodig<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showHeroBadges }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; gap: 12px; flex-wrap: wrap; margin-top: 36px\">\n        <div style=\"background: #FFFFFF; border: 1px solid rgba(17,17,17,0.08); border-radius: 18px; padding: 14px 18px\">\n          <div style=\"font-family: 'Manrope'; font-weight: 800; font-size: 20px; color: #111111\">3 minute<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #4B565F\">Van begin tot einde<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #111111; border-radius: 18px; padding: 14px 18px\">\n          <div style=\"font-family: 'Manrope'; font-weight: 800; font-size: 20px; color: #8CC8E8\">Geen koste<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #F2F0EB; max-width: 220px\">Gratis assessering, resultate dadelik op die skerm<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <section style=\"max-width: 1120px; margin: 0 auto; padding: 96px 20px 0\">\n    <div style=\"text-align: center; max-width: 640px; margin: 0 auto\">\n      <div style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #1F3D73\">Hoe dit werk<\u002Fdiv>\n      <h2 style=\"font-family: 'Manrope'; font-weight: 800; font-size: clamp(27px, 4.4vw, 36px); line-height: 1.15; letter-spacing: -0.02em; color: #111111; margin: 12px 0 0; text-wrap: balance\">Drie eenvoudige stappe, geen wag vir resultate nie<\u002Fh2>\n      <p style=\"font-size: 17px; line-height: 1.6; color: #4B565F; margin: 14px 0 0; text-wrap: pretty\">Alles gebeur in een sitting, en jy kry 'n duidelike antwoord voordat jy die bladsy toemaak.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position: relative; margin-top: 44px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px\">\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(17,17,17,0.07); border-radius: 20px; padding: 26px\">\n        <div style=\"width: 40px; height: 40px; border-radius: 999px; background: #111111; color: #F2F0EB; display: flex; align-items: center; justify-content: center; font-family: 'Manrope'; font-weight: 800; font-size: 17px\">1<\u002Fdiv>\n        <h3 style=\"font-family: 'Manrope'; font-weight: 700; font-size: 20px; color: #111111; margin: 18px 0 0\">Antwoord 15 vinnige vrae<\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 1.6; color: #4B565F; margin: 8px 0 0\">Oor hoe jou kind tans lees en op skool vaar, geen voorbereiding nodig nie.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(17,17,17,0.07); border-radius: 20px; padding: 26px\">\n        <div style=\"width: 40px; height: 40px; border-radius: 999px; background: #111111; color: #F2F0EB; display: flex; align-items: center; justify-content: center; font-family: 'Manrope'; font-weight: 800; font-size: 17px\">2<\u002Fdiv>\n        <h3 style=\"font-family: 'Manrope'; font-weight: 700; font-size: 20px; color: #111111; margin: 18px 0 0\">Kry jou resultaat dadelik<\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 1.6; color: #4B565F; margin: 8px 0 0\">Sien presies waar jou kind staan, op die skerm, sodra jy klaar is.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(17,17,17,0.07); border-radius: 20px; padding: 26px\">\n        <div style=\"width: 40px; height: 40px; border-radius: 999px; background: #111111; color: #F2F0EB; display: flex; align-items: center; justify-content: center; font-family: 'Manrope'; font-weight: 800; font-size: 17px\">3<\u002Fdiv>\n        <h3 style=\"font-family: 'Manrope'; font-weight: 700; font-size: 20px; color: #111111; margin: 18px 0 0\">Stuur dit met een druk<\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 1.6; color: #4B565F; margin: 8px 0 0\">Een druk stuur jou resultate per WhatsApp, en ons stuur die gratis hulpbron terug.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1120px; margin: 0 auto; padding: 96px 20px 0\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 48px; align-items: start\">\n      <div>\n        <div style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #1F3D73\">Waarom ouers hierop vertrou<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 26px; margin-top: 24px\">\n          <div style=\"display: flex; gap: 16px; align-items: flex-start\">\n            <div style=\"width: 30px; height: 30px; flex: 0 0 auto; border-radius: 999px; background: #8CC8E8; color: #111111; display: flex; align-items: center; justify-content: center\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fdiv>\n            <div>\n              <h3 style=\"font-family: 'Manrope'; font-weight: 700; font-size: 19px; color: #111111; margin: 2px 0 0\">Gebou deur iemand wat studeer hoe mense leer<\u002Fh3>\n              <p style=\"font-size: 15px; line-height: 1.65; color: #4B565F; margin: 8px 0 0; text-wrap: pretty\">Stigter Kyle Britz het Bedryfsielkunde aan die Universiteit van die Vrystaat studeer, en het LocalTutors rondom werklike resultate gebou, nie meer huiswerk nie.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 16px; align-items: flex-start\">\n            <div style=\"width: 30px; height: 30px; flex: 0 0 auto; border-radius: 999px; background: #8CC8E8; color: #111111; display: flex; align-items: center; justify-content: center\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fdiv>\n            <div>\n              <h3 style=\"font-family: 'Manrope'; font-weight: 700; font-size: 19px; color: #111111; margin: 2px 0 0\">Ons raai nie, ons vind eers die gaping<\u002Fh3>\n              <p style=\"font-size: 15px; line-height: 1.65; color: #4B565F; margin: 8px 0 0; text-wrap: pretty\">Elke leerder begin met 'n assessering soos hierdie een, en dan 'n plan wat rondom presies daardie bevindinge gebou is.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 16px; align-items: flex-start\">\n            <div s ing: -0.02em; color: #111111; margin: 12px 0 0; text-wrap: balance\">Drie dinge wat hierdie assessering meet<\u002Fh2>\n      <p style=\"font-size: 17px; line-height: 1.6; color: #4B565F; margin: 14px 0 0; text-wrap: pretty\">Nie 'n raaiskoot nie, 'n duidelike beeld van waar dinge vandag staan.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top: 44px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px\">\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(17,17,17,0.07); border-radius: 18px; padding: 24px\">\n        <div style=\"display: inline-block; padding: 5px 13px; border-radius: 999px; background: #1F3D73; color: #FFFFFF; font-family: 'Manrope'; font-weight: 800; font-size: 13px\">01<\u002Fdiv>\n        <p style=\"font-size: 16px; line-height: 1.6; color: #1F2933; margin: 16px 0 0; text-wrap: pretty\">Of jou kind se leesprobleme normaal is vir hulle ouderdom, of 'n teken dat iets aandag nodig het<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(17,17,17,0.07); border-radius: 18px; padding: 24px\">\n        <div style=\"display: inline-block; padding: 5px 13px; border-radius: 999px; background: #1F3D73; color: #FFFFFF; font-family: 'Manrope'; font-weight: 800; font-size: 13px\">02<\u002Fdiv>\n        <p style=\"font-size: 16px; line-height: 1.6; color: #1F2933; margin: 16px 0 0; text-wrap: pretty\">Die spesifieke area wat hulle terughou, of dit woorde uitklank, begrip van wat hulle lees, of selfvertroue is<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(17,17,17,0.07); border-radius: 18px; padding: 24px\">\n        <div style=\"display: inline-block; padding: 5px 13px; border-radius: 999px; background: #1F3D73; color: #FFFFFF; font-family: 'Manrope'; font-weight: 800; font-size: 13px\">03<\u002Fdiv>\n        <p style=\"font-size: 16px; line-height: 1.6; color: #1F2933; margin: 16px 0 0; text-wrap: pretty\">'n Duidelike volge 5-.17 1.43z\"><\u002Fpath><\u002Fsvg>\n          <span style=\"display: flex; flex-direction: column; gap: 4px; text-align: left\">\n            <span style=\"font-size: 17px; font-weight: 700\">Vra vir die gratis gids op WhatsApp<\u002Fspan>\n            <span style=\"font-size: 14px; line-height: 1.45; color: #C9E7D5\">Die gesprek maak oop met jou resultaat reeds ingevul. Ons stuur die gids terug, plus die volgende stappe vir jou kind.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fspan>\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: 0 0 auto\"><line x1=\"4\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"13 6 19 12 13 18\"><\u002Fpolyline><\u002Fsvg>\n      <\u002Fa>\n      <sc-if value=\"{{ sendFailed }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: #E8C9C0\">Ons kon jou resultate nie outomaties stoor nie. Die WhatsApp-boodskap hierbo bevat steeds alles wat ons nodig het, of skakel ons op 069 734 6705.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: 20px; border: 1px solid rgba(17,17,17,0.14); border-radius: 18px; padding: 20px\">\n    <div style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #4B565F\">Belangrik<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.6; color: #1F2933; margin: 10px 0 0; text-wrap: pretty\">Hierdie is 'n siftingsvraelys, nie 'n diagnose nie. Dit kan nie vir jou sê of jou kind disleksie of 'n leerprobleem het nie, en sal dit nooit beweer nie.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"font-size: 14px; font-weight: 700; color: #4B565F; margin-top: 28px\">Eerder net met iemand praat?<\u002Fdiv>\n  <div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px\">\n    <a href=\"te t;:&quot;Gedrag&quot;},&quot;showHeroBadges&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Landingsblad&quot;},&quot;whatsappUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://wa.me/27697346705&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Gedrag&quot;},&quot;formEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://formspree.io/f/xkjnzkkp&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Gedrag&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    wordIndex: 0,\n    view: \"landing\",\n    qi: 0,\n    answers: {},\n    form: { name: \"\", email: \"\", grade: \"\", phone: \"\", consent: false },\n    errors: {},\n    send: \"idle\",\n    loc: null\n  };\n\n  // Fifteen questions in three sections. `scored` questions each run 0-3 from\n  // best to worst answer, so the total is out of 24; the rest are context only.\n  questions = [\n    {\n      text: \"Wat is die taal van onderrig by jou kind se skool?\",\n      options: [\"Afrikaans\", \"Engels\", \"Afrikaans en Engels\", \"Ander\"]\n    },\n    {\n      text: \"Hoe sou jy jou kind se algemene skoolprestasie oor die afgelope twee kwartale beskryf?\",\n      options: [\"Baie goed\", \"Goed\", \"Gemiddeld\", \"Sukkelend\"],\n      scored: true,\n      area: \"skoolprestasie\"\n    },\n    {\n      text: \"Het jou kind gedurende die afgelope twee kwartale enige vakke gedruip?\",\n      options: [\"Ja, een vak\", \"Ja, meer as een vak\", \"Nee\", \"Ek is nie seker nie\"],\n      scores: [2, 3, 0, 1],\n      scored: true,\n      area: \"skoolprestasie\"\n    },\n    {\n      text: \"Watter vakke is tans die moeilikste vir jou kind?\",\n      options: [\"Wiskunde\", \"Tale\", \"EBW / Natuurwetenskappe\", \"Ander / Ek is nie seker nie\"]\n    },\n    {\n      text: \"Hoe het jou kind se skoolprestasie oor die afgelope ja ie, so hierdie assessering is werklik die beginpunt. Daar is geen verkeerde stap van hier af nie.\"\n  };\n\n  nexts = {\n    \"Ek wil net my kind se resultate verstaan\": \"Jy wil net die resultate verstaan, en dit is presies wat hierbo staan. Vra ons gerus as enigiets onduidelik is.\",\n    \"Ek wil praktiese hulpbronne hê om hulle self te help\": \"Jy wil praktiese hulpbronne hê, en dit is presies wat die gratis gids is. Vra daarvoor hieronder.\",\n    \"Ek wil met iemand oor my kind se resultate praat\": \"Jy wil met iemand praat, so vra hieronder vir die gids en ons antwoord persoonlik oor die resultate.\",\n    \"Ek wil moontlike ekstra ondersteuning bespreek\": \"Jy wil ekstra ondersteuning bespreek, so vra hieronder vir die gids en ons stuur die volgende stappe saam.\"\n  };\n\n  heroWords = [\"geveg\", \"tweestryd\", \"gesukkel\", \"uitbarsting\"];\n\n  reduceMotion() {\n    return !!(window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches);\n  }\n\n  revealTargets() {\n    const root = document.querySelector(\"main\");\n    if (!root) return [];\n    const out = [];\n    const push = (el) => { if (el && el.nodeType === 1 && out.indexOf(el) === -1) out.push(el); };\n    // A \"band\" is a page-level region: every landing section, the hero, and the\n    // shared #screen wrapper used by the credibility, details, question and\n    // result views. Reveal its blocks — and where a block is a grid or flex row\n    // of cards, reveal the cards instead so the row stages across.\n    const bands = root.querySelectorAll(\"section, #hero, #screen, [data-reveal-band]\");\n    Array.prototype.forEach.call(bands, (band) => {\n      Array.prototype.forEach.call(band.children, (child) => {\n        const cs = getComputedStyle(child);\n        const isRow = (cs.display === \"grid\" || cs.display === \"flex\") && child.children.length > 1;\n        if (isRow && child.getBoundingClientRect().height > 120) {\n          Array.prototype.forEach.call(child.children, push);\n        } else {\n          push(child);\n        }\n      });\n    });\n    return out.filter((el) => {\n      const r = el.getBoundingClientRect();\n      return r.height > 24 && getComputedStyle(el).position !== \"fixed\";\n    });\n  }\n\n  showNow(el, delay) {\n    if (!el || el.dataset.dcRevealed === \"1\") return;\n    el.dataset.dcRevealed = \"1\";\n    el.style.transitionDelay = (delay || 0) + \"ms\";\n    requestAnimationFrame(() => {\n      el.style.opacity = \"1\";\n      el.style.transform = \"translate3d(0, 0, 0)\";\n    });\n    setTimeout(() => { el.style.willChange = \"\"; el.style.transition = \"\"; el.style.transitionDelay = \"\"; }, 780 + (delay || 0));\n  }\n\n  clearReveal(el) {\n    if (!el) return;\n    el.dataset.dcRevealed = \"1\";\n    el.style.opacity = \"\";\n    el.style.transform = \"\";\n    el.style.transition = \"\";\n    el.style.transitionDelay = \"\";\n    el.style.willChange = \"\";\n  }\n\n  initReveal() {\n    if (this._io) { this._io.disconnect(); this._io = null; }\n    clearTimeout(this._failsafe);\n    if (this.reduceMotion()) return;\n    const targets = this.revealTargets();\n    if (!targets.length) return;\n    const vh = window.innerHeight || 800;\n    targets.forEach((el) => {\n      const r = el.getBoundingClientRect();\n      if (r.top < vh * 0.9) { el.dataset.dcRevealed = \"1\"; return; }\n      el.style.willChange = \"opacity, transform\";\n      el.style.opacity = \"0\";\n      el.style.transform = \"translate3d(0, 22px, 0)\";\n      el.style.transition = \"opacity 620ms cubic-bezier(0.22,0.68,0,1), transform 680ms cubic-bezier(0.22,0.68,0,1)\";\n    });\n    const stagger = (el) => {\n      const i = el.parentElement ? Array.prototype.indexOf.call(el.parentElement.children, el) : 0;\n      return Math.min(i, 5) * 70;\n    };\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (!entry.isIntersecting) return;\n        this._io.unobserve(entry.target);\n        this.showNow(entry.target, stagger(entry.target));\n      });\n    }, { rootMargin: \"0px 0px -12% 0px\", threshold: 0.01 });\n    const pending = targets.filter((el) => el.dataset.dcRevealed !== \"1\");\n    pending.forEach((el) => this._io.observe(el));\n    requestAnimationFrame(() => {\n      pending.forEach((el) => {\n        const r = el.getBoundingClientRect();\n        if (r.top < (window.innerHeight || 800) && r.bottom > 0) {\n          if (this._io) this._io.unobserve(el);\n          this.showNow(el, stagger(el));\n        }\n      });\n    });\n    this._failsafe = setTimeout(() => {\n      pending.forEach((el) => { if (el.style.opacity === \"0\") this.clearReveal(el); });\n    }, 4000);\n  }\n\n  initScrollChrome() {\n    if (this._onScroll) window.removeEventListener(\"scroll\", this._onScroll);\n    if (this._chromeRaf) cancelAnimationFrame(this._chromeRaf);\n    this._chromeRaf = 0;\n    const bar = document.getElementById(\"dc-progress\");\n    const head = document.querySelector(\"main header\");\n    this._onScroll = () => {\n      if (this._chromeRaf) return;\n      this._chromeRaf = requestAnimationFrame(() => {\n        this._chromeRaf = 0;\n        const y = window.scrollY || 0;\n        const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);\n        if (bar) bar.style.transform = \"scaleX(\" + Math.min(1, y / max) + \")\";\n        if (head) {\n          const on = y > 8;\n          head.style.boxShadow = on ? \"0 1px 0 rgba(17,17,17,0.10), 0 10px 30px -22px rgba(17,17,17,0.5)\" : \"none\";\n          head.style.borderBottomColor = on ? \"rgba(17,17,17,0.12)\" : \"rgba(17,17,17,0.08)\";\n        }\n      });\n    };\n    window.addEventListener(\"scroll\", this._onScroll, { passive: true });\n    window.addEventListener(\"resize\", this._onScroll, { passive: true });\n    this._onScroll();\n  }\n\n  syncMotion() {\n    clearTimeout(this._revealT);\n    this._revealT = setTimeout(() => {\n      try { this.initReveal(); } catch (e) { console.warn(\"reveal init failed\", e); }\n      try { this.initScrollChrome(); } catch (e) { console.warn(\"scroll chrome init failed\", e); }\n    }, 60);\n  }\n\n  componentDidUpdate() {\n    // This runtime does not pass prevState, so track the view ourselves.\n    if (this._lastView !== this.state.view) {\n      this._lastView = this.state.view;\n      if (this._io) { this._io.disconnect(); this._io = null; }\n      this.syncMotion();\n    }\n  }\n\n  componentDidMount() {\n    this._rot = setInterval(() => this.cycleWord(), 2000);\n    this.syncMotion();\n    // Approximate location only, no permission prompt, must never block the flow.\n    fetch(\"https://ipapi.co/json/\")\n      .then((r) => (r.ok ? r.json() : null))\n      .then((d) => {\n        if (d) this.setState({ loc: { city: d.city, region: d.region, country: d.country_name, ip: d.ip } });\n      })\n      .catch(() => {});\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._rot);\n    clearTimeout(this._swap);\n    clearTimeout(this._revealT);\n    clearTimeout(this._failsafe);\n    clearTimeout(this._t);\n    if (this._chromeRaf) cancelAnimationFrame(this._chromeRaf);\n    if (this._io) this._io.disconnect();\n    if (this._onScroll) {\n      window.removeEventListener(\"scroll\", this._onScroll);\n      window.removeEventListener(\"resize\", this._onScroll);\n    }\n  }\n\n  buildRotator() {\n    const active = this.state.wordIndex || 0;\n    const phase = this.state.wordPhase || \"in\";\n    const word = this.heroWords[active];\n    const frames = {\n      in: { opacity: 1, transform: \"translateY(0)\", transition: \"opacity 300ms ease, transform 300ms ease\" },\n      out: { opacity: 0, transform: \"translateY(-20px)\", transition: \"opacity 300ms ease, transform 300ms ease\" },\n      pre: { opacity: 0, transform: \"translateY(20px)\", transition: \"none\" }\n    };\n    const f = frames[phase];\n    return React.createElement(\n      \"span\",\n      {\n        style: {\n          position: \"relative\",\n          display: \"inline-block\",\n          verticalAlign: \"bottom\",\n          overflow: \"hidden\",\n          fontSize: \"0.92em\",\n          lineHeight: 1.1,\n          paddingBottom: \"0.16em\",\n          marginBottom: \"-0.16em\"\n        }\n      },\n      React.createElement(\"span\", { \"aria-hidden\": \"true\", style: { display: \"inline-block\", whiteSpace: \"nowrap\", visibility: \"hidden\" } }, word),\n      React.createElement(\n        \"span\",\n        {\n          key: word,\n          style: {\n            position: \"absolute\",\n            left: 0,\n            top: 0,\n            display: \"inline-block\",\n            whiteSpace: \"nowrap\",\n            color: \"#1F3D73\",\n            opacity: f.opacity,\n            transform: f.transform,\n            transition: f.transition\n          }\n        },\n        word\n      )\n    );\n  }\n\n  cycleWord() {\n    if (this.state.view !== \"landing\") return;\n    if (this.reduceMotion()) {\n      this.setState((st) => ({ wordIndex: ((st.wordIndex || 0) + 1) % this.heroWords.length, wordPhase: \"in\" }));\n      return;\n    }\n    this.setState({ wordPhase: \"out\" });\n    this._swap = setTimeout(() => {\n      this.setState((st) => ({ wordIndex: ((st.wordIndex || 0) + 1) % this.heroWords.length, wordPhase: \"pre\" }));\n      requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ wordPhase: \"in\" })));\n    }, 300);\n  }\n\n  opts(i) {\n    const q = this.questions[i];\n    return (q && q.options) || [];\n  }\n\n  scoreOf(i) {\n    const q = this.questions[i];\n    if (!q || !q.scored) return 0;\n    const a = this.state.answers[i];\n    if (a == null) return 0;\n    const idx = this.opts(i).indexOf(a);\n    if (idx < 0) return 0;\n    return q.scores ? q.scores[idx] : idx;\n  }\n\n  maxTotal() {\n    return this.questions.reduce((n, q) => n + (q.scored ? 3 : 0), 0);\n  }\n\n  band() {\n    let total = 0;\n    let high = 0;\n    this.questions.forEach((q, i) => {\n      if (!q.scored) return;\n      const s = this.scoreOf(i);\n      total += s;\n      if (s >= 3) high++;\n    });\n    const max = this.maxTotal();\n    let band = total >= max * 0.66 ? \"red\" : total >= max * 0.33 ? \"orange\" : \"green\";\n    if (high >= 4) band = \"red\";\n    if (high >= 1 && band === \"green\") band = \"orange\";\n    return { band: band, total: total, high: high, max: max };\n  }\n\n  areaSums() {\n    const sums = {};\n    const maxes = {};\n    this.questions.forEach((q, i) => {\n      if (!q.scored || !q.area) return;\n      sums[q.area] = (sums[q.area] || 0) + this.scoreOf(i);\n      maxes[q.area] = (maxes[q.area] || 0) + 3;\n    });\n    return { sums: sums, maxes: maxes };\n  }\n\n  areaRows() {\n    const d = this.areaSums();\n    const rows = Object.keys(d.sums).map((k) => ({\n      key: k,\n      name: this.areaLabels[k] || k,\n      sum: d.sums[k],\n      pct: Math.round((d.sums[k] / d.maxes[k]) * 100)\n    }));\n    rows.sort((a, b) => b.pct - a.pct || b.sum - a.sum);\n    return rows;\n  }\n\n  topArea() {\n    const rows = this.areaRows();\n    return rows.length && rows[0].pct > 0 ? rows[0].name : null;\n  }\n\n  go(view) {\n    this.setState({ view: view });\n    if (typeof window !== \"undefined\") window.scrollTo(0, 0);\n    // Reaching the results screen is what captures the lead, so nothing is lost\n    // if the parent never opens WhatsApp. Sent once per run.\n    if (view === \"result\" && !this._sentOnce) {\n      this._sentOnce = true;\n      this.submitPayload(\"Assessering voltooi\").then(\n        () => this.setState({ send: \"ok\" }),\n        () => this.setState({ send: \"error\" })\n      );\n    }\n  }\n\n  pick(i, label) {\n    const answers = Object.assign({}, this.state.answers);\n    answers[i] = label;\n    this.setState({ answers: answers });\n    const delay = this.props.autoAdvanceDelay ?? 320;\n    clearTimeout(this._t);\n    this._t (this.state || {}).form || {};\n    const name = (form.name || \"\").trim();\n    const b = this.band();\n    const top = this.topArea();\n    let msg = \"Hi LocalTutors, \";\n    msg += name ? \"my naam is \" + name + \". \" : \"\";\n    msg += \"Ek het pas die leesassessering op julle webwerf voltooi\";\n    if (form.grade) msg += \" vir my kind in \" + form.grade;\n    msg += \". Ons telling was \" + (b && b.total != null ? b.total : 0) + \" uit \" + (b && b.max ? b.max : 24);\n    if (top) msg += \", met \" + this.lower(top) + \" wat die meeste uitgestaan het\";\n    msg += \". Kan julle asseblief die gratis gids vir my stuur, en my laat weet wat die volgende stappe is wat ek moet neem?\";\n    return base + (base.indexOf(\"?\") === -1 ? \"?\" : \"&\") + \"text=\" + encodeURIComponent(msg);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const view = s.view;\n    const i = s.qi;\n    const q = this.questions[i];\n    const b = this.band();\n    const top = this.topArea();\n    const concern = s.answers[11];\n    const done = s.answers[13];\n    const wantNext = s.answers[14];\n\n    const headings = {\n      green: \"Goeie nuus, lees lyk of dit op koers is.\",\n      orange: \"Daar is 'n duidelike kans om dit betyds aan te spreek.\",\n      red: \"Dit is die moeite werd om gou aandag te gee, en dit is baie regstelbaar.\"\n    };\n    const bodies = {\n      green: \"Niks in jou antwoorde dui op beduidende leesprobleme op die oomblik nie. Lees groei steeds die vinnigste met gereelde oefening, en ons kan die gratis hulpbron met kort daaglikse aktiwiteite vir jou stuur.\",\n      orange: \"Dit lyk of jou kind teen werklike uitdagings met lees vasloop. Die goeie nuus is dat geteikende oefening in die regte area gewoonlik binne een kwartaal 'n merkbare verskil maak.\",\n      red: \"'n Paar areas het duidelik in jou antwoorde uitgestaan. Hierdie sifting kan nie 'n leerprobleem diagnoseer nie, maar dit is 'n sterk genoeg teken dat dit die moeite werd is om di t\",\n\n      rotator: this.buildRotator(),\n      onDetailsKey: (e) => {\n        if (e.key === \"Enter\") {\n          e.preventDefault();\n          this.submitDetails();\n        }\n      },\n      qNumber: i + 1,\n      resultEyebrow: (s.form.name.trim() ? s.form.name.trim().split(\" \")[0] + \", hier is wat jou antwoorde wys\" : \"Hier is wat jou antwoorde wys\") + (s.form.grade ? \" vir \" + s.form.grade : \"\"),\n      labGreen: b.band === \"green\" ? \"#1F6B4A\" : \"#4B565F\",\n      labOrange: b.band === \"orange\" ? \"#8A4E12\" : \"#4B565F\",\n      labRed: b.band === \"red\" ? \"#9E3A26\" : \"#4B565F\",\n      showHeroBadges: this.props.showHeroBadges ?? true,\n\n      startQuiz: () => this.go(\"credibility\"),\n      backToLanding: () => this.go(\"landing\"),\n      backToCredibility: () => this.go(\"credibility\"),\n      goDetails: () => this.go(\"details\"),\n      submitDetails: () => this.submitDetails(),\n      startOver: () => this.startOver(),\n\n      fName: s.form.name,\n      fEmail: s.form.email,\n      fPhone: s.form.phone,\n      fConsent: s.form.consent,\n      onName: (e) => this.setField(\"name\", e.target.value),\n      onEmail: (e) => this.setField(\"email\", e.target.value),\n      onPhone: (e) => this.setField(\"phone\", e.target.value),\n      onConsent: (e) => this.setField(\"consent\", e.target.checked),\n      errName: s.errors.name || \"\",\n      errEmail: s.errors.email || \"\",\n      errGrade: s.errors.grade || \"\",\n      grades: [\"Graad 3\", \"Graad 4\", \"Graad 5\", \"Graad 6\", \"Graad 7\", \"Graad 8\", \"Graad 9\", \"Graad 10\", \"Graad 11\", \"Graad 12\"].map((g) => ({\n        label: g,\n        picked: s.form.grade === g,\n        style: this.gradeStyle(s.form.grade === g),\n        onPick: () => this.setField(\"grade\", g)\n      })),\n\n      qCounter: \"Vraag \" + (i + 1) + \" van \" + this.questions.length,\n      qTag: sect.label,\n      qProgress: ((i + 1) / this.questions.length).toFixed(3),\n      qText: q
