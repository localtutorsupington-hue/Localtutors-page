<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="12 quick Grade 9 Maths questions. Find where your marks are leaking and get three 20-minute quick wins. About 8 minutes, in English or Afrikaans.">

<meta property="og:description" content="12 quick Grade 9 Maths questions. Find where your marks are leaking and get three 20-minute quick wins. About 8 minutes, in English or Afrikaans.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111111'/%3E%3Cpath transform='translate(9 7.25) scale(.5833)' d='M12 1C12 1 3 12.5 3 18.5a9 9 0 0 0 18 0C21 12.5 12 1 12 1Z' fill='%238CC8E8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#FFFFFF; --shell:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#111111; --text:#1F2933; --muted:#5B6570; --line:#E7E9ED; --tick:#E6E8EC;
  --accent:#2563A6; --accent-hover:#1D528A; --accent-ink:#FFFFFF; --accent-text:#2563A6; --accent-soft:#EAF2FB;
  --sky:#8CC8E8; --sky-ink:#111111;
  --leak:#C2410C; --leak-soft:#FCEDE4; --warn:#B7791F; --warn-soft:#FBF1DE; --good:#1F7A4D; --good-soft:#E6F3EC;
  --panel:#111111; --panel-2:#24272B; --panel-line:#3A3F45; --panel-text:#E9E7E1; --panel-muted:#A9B1BA;
  --drop-empty:#E3E6EA; --shadow:rgba(17,17,17,.06);
  color-scheme:light;
  --f-display:"Bricolage Grotesque",Manrope,system-ui,sans-serif;
  --f-body:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);color:var(--ink);letter-spacing:-0.02em;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
a{color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.3) blur(10px);-webkit-backdrop-filter:saturate(1.3) blur(10px)}
.topbar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{flex:none;width:30px;height:30px;border-radius:9px;background:var(--panel);display:grid;place-items:center}
.brand-mark svg{width:13px;height:17px}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--ink);line-height:1}
.brand-tag{font-size:12px;font-weight:600;color:var(--muted);line-height:1.3;margin-top:2px}
.lang{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;color:var(--muted);transition:background-color 180ms ease,color 180ms ease,transform 160ms var(--ease-out)}
.lang button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}

main{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:16px 56px}
.screen{display:flex;flex-direction:column;gap:16px;animation:enter 300ms var(--ease-out) backwards}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}

.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--text)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-text)}
.h1{font-size:clamp(32px,8.8vw,46px);font-weight:800}
.h2{font-size:clamp(24px,6.4vw,30px);font-weight:800}
.h3{font-size:19px;font-weight:600}
.lead{font-size:17px;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px}
.group{display:flex;flex-direction:column;gap:8px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:14px 20px;border-radius:14px;font-weight:800;font-size:16px;text-decoration:none;text-align:center;transition:transform 160ms var(--ease-out),background-color 180ms ease,border-color 180ms ease}
.btn:active{transform:scale(0.97)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-sky{background:var(--sky);color:var(--sky-ink)}
.link{align-self:center;font-size:14px;font-weight:700;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px;padding:6px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted);padding:6px 0}
@media (hover:hover) and (pointer:fine){
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-ghost:hover{border-color:var(--muted)}
  .opt:hover{border-color:var(--muted)}
  .back:hover{color:var(--ink)}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-tint{background:var(--accent-soft);border-color:transparent}
.panel{background:var(--panel);border:1px solid var(--panel-line);color:var(--panel-text);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.panel h2,.panel h3{color:#FFFFFF}

.rules{display:grid;gap:12px;counter-reset:r;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:16px;min-width:0}
.rules li::before{counter-increment:r;content:counter(r);flex:none;width:26px;height:26px;border-radius:50%;background:var(--sky);color:var(--sky-ink);font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:1px}
label.lab{font-size:14px;font-weight:700;color:var(--ink)}
.field{display:block;width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 14px;font-size:16px;transition:border-color 160ms ease}
.field:focus{outline:none;border-color:var(--accent)}
.field.err{border-color:var(--leak)}
.err-msg{font-size:13px;font-weight:700;color:var(--leak)}

/* Question */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips svg{width:11px;height:14px}
.pips .cur{transform:translateY(-2px)}
.topic-chip{align-self:flex-start;font-size:12px;font-weight:800;color:var(--accent-text);background:var(--accent-soft);padding:5px 10px;border-radius:999px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px;text-align:center;min-width:0}
.qprompt{font-size:15px;font-weight:600;color:var(--muted)}
.qmath{font-size:clamp(30px,9vw,40px);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.25;margin-top:6px}
.qword{font-size:19px;font-weight:600;color:var(--ink);line-height:1.45;text-align:left}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.7em;line-height:1.08;margin:0 .08em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 .18em}
sup{font-size:.58em;line-height:0}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;min-height:58px;font-weight:700;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums;transition:transform 160ms var(--ease-out),border-color 160ms ease,background-color 160ms ease}
.opt:active{transform:scale(0.97)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted);transition:background-color 160ms ease,color 160ms ease}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt-idk{justify-content:center;background:transparent;border-style:dashed;color:var(--muted);font-size:16px;min-height:50px}
.opt-idk.sel{color:var(--accent-text)}
.conf{background:var(--panel);border:1px solid var(--panel-line);border-radius:28px;padding:16px;opacity:0;transform:translateY(8px);pointer-events:none;visibility:hidden;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out),visibility 0s linear 200ms}
.conf.show{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
.conf-q{font-family:var(--f-display);font-weight:600;font-size:18px;color:#FFFFFF}
.conf-hint{font-size:13px;color:var(--panel-muted);margin-top:2px}
.conf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.conf-row .btn{min-height:52px;border-radius:12px}
.conf-row .btn-ghost{background:var(--panel-2);border-color:var(--panel-line);color:#FFFFFF}

/* Analysing */
.an-wrap{padding-top:32px;align-items:center;text-align:center}
.drip{width:56px;height:72px;animation:bob 1.3s var(--ease-in-out) infinite alternate}
@keyframes bob{to{transform:translateY(6px)}}
.an-list{display:grid;gap:14px;width:100%;max-width:340px;text-align:left}
.an-item{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--ink);opacity:.35;transition:opacity 240ms ease}
.an-item.done{opacity:1}
.an-ic{flex:none;width:26px;height:26px;border-radius:50%;background:var(--drop-empty);display:grid;place-items:center;transition:background-color 240ms ease}
.an-item.done .an-ic{background:var(--accent)}
.an-ic svg{width:14px;height:14px;color:#FFFFFF;opacity:0;transform:scale(.8);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
.an-item.done .an-ic svg{opacity:1;transform:none}

/* Report */
.report>*{animation:enter 360ms var(--ease-out) backwards}
.report>*:nth-child(2){animation-delay:50ms}
.report>*:nth-child(3){animation-delay:100ms}
.report>*:nth-child(4){animation-delay:150ms}
.report>*:nth-child(5){animation-delay:200ms}
.report>*:nth-child(n+6){animation-delay:240ms}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:26px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:600;color:var(--muted)}
.leak-list{display:flex;flex-direction:column}
.leak-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.leak-row:first-child{border-top:0;padding-top:2px}
.leak-row .name{flex:1;min-width:0;font-weight:700;color:var(--ink);font-size:15px}
.leak-row .name small{display:block;font-weight:500;color:var(--muted);font-size:13px;line-height:1.4;margin-top:1px}
.drops{display:flex;gap:3px;flex:none}
.drops svg{width:13px;height:17px}
.lvl{flex:none;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;min-width:88px;text-align:center}
.lvl-0{background:var(--good-soft);color:var(--good)}
.lvl-1,.lvl-2{background:var(--warn-soft);color:var(--warn)}
.lvl-3{background:var(--leak-soft);color:var(--leak)}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:14px;padding:12px;border:1.5px solid transparent;min-width:0}
.tile b{display:block;font-family:var(--f-display);font-size:30px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .tt{font-weight:800;font-size:14px;color:var(--ink);margin-top:6px}
.tile .td{font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
.tile.solid{background:var(--good-soft)} .tile.shaky{background:var(--warn-soft)} .tile.misc{background:var(--leak-soft)} .tile.gap{background:var(--surface-2)}
.tile.hi{border-color:var(--ink)}
.mist{display:grid;gap:12px}
.mist-row .top{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;color:var(--ink)}
.mist-row .d{font-size:13px;line-height:1.4;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transform-origin:left center;animation:grow 700ms var(--ease-out) 300ms backwards}
@keyframes grow{from{transform:scaleX(0)}}
.fix{display:grid;gap:10px}
.fix-card{border-radius:16px;padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.fix-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fix-n{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.fix-time{font-size:12px;font-weight:800;color:var(--muted)}
.fix-card p{font-size:16px}
.fix-warn{font-size:13px;font-weight:600;color:var(--leak);background:var(--leak-soft);padding:8px 10px;border-radius:10px}
details.answers summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;color:var(--ink)}
details.answers summary::-webkit-details-marker{display:none}
details.answers summary svg{width:18px;height:18px;flex:none;transition:transform 200ms var(--ease-out)}
details.answers[open] summary svg{transform:rotate(180deg)}
.ans{padding:14px 0;border-top:1px solid var(--line)}
.ans:first-of-type{margin-top:12px}
.ans .aq{font-weight:700;color:var(--ink);font-size:15px}
.ans .am{font-size:14px;margin-top:4px;color:var(--muted)}
.ans .am b{color:var(--ink)}
.ans .ae{font-size:15px;margin-top:6px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tag.solid{background:var(--good-soft);color:var(--good)} .tag.shaky{background:var(--warn-soft);color:var(--warn)} .tag.misc{background:var(--leak-soft);color:var(--leak)} .tag.gap{background:var(--surface-2);color:var(--muted)}
.send-steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.send-steps li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--panel-text)}
.send-steps svg{flex:none;width:18px;height:18px;color:var(--sky);margin-top:2px}
.codebox{display:flex;gap:8px;align-items:stretch}
.codebox input{flex:1;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--panel-line);background:var(--panel-2);color:#FFFFFF;padding:10px 12px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.codebox button{flex:none;border-radius:12px;background:var(--panel-2);border:1px solid var(--panel-line);color:#FFFFFF;font-weight:800;font-size:14px;padding:0 14px;transition:transform 160ms var(--ease-out)}
.codebox button:active{transform:scale(0.97)}
.num{font-weight:800;color:#FFFFFF;user-select:all}
.disclaim{font-size:13px;color:var(--muted);text-align:center;padding-inline:8px}
.banner{background:var(--accent-soft);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.banner .meta{font-size:13px;font-weight:700;color:var(--muted)}
.banner .focus{font-size:15px;font-weight:700;color:var(--ink);margin-top:4px}
.paste{display:flex;flex-direction:column;gap:8px}


/* Results */
main.wide{max-width:780px}
.r-shell{background:var(--shell);border:1px solid var(--line);border-radius:28px;padding:12px;display:flex;flex-direction:column;gap:12px}
.r-top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:6px 4px 4px}
.r-logo{flex:none;width:52px;height:52px;border-radius:12px;background:var(--panel);display:grid;place-items:center}
.r-logo svg{width:20px;height:26px}
.r-id{flex:1;min-width:170px}
.r-id h1{font-size:22px;font-weight:600;letter-spacing:-0.02em}
.r-id p{font-size:14px;color:var(--muted);margin-top:2px}
.r-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;width:100%}
.r-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;min-width:0;white-space:normal;line-height:1.2;text-align:center;transition:transform 160ms var(--ease-out),border-color 160ms ease}
.r-btn:active{transform:scale(0.97)}
.r-btn svg{width:16px;height:16px;flex:none}
.r-btn.dark{background:var(--panel);border-color:var(--panel);color:#FFFFFF;padding:6px 12px}
.r-btn-sm{flex:none;min-height:36px;padding:0 12px;font-size:13px}
.r-row{display:grid;gap:12px}
.r-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.r-info{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.r-k{font-size:12px;font-weight:600;color:var(--muted)}
.r-v{font-size:14px;font-weight:700;color:var(--ink);margin-top:4px;overflow-wrap:break-word}
.r-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.r-chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:5px 9px;border-radius:8px;border:1px solid transparent}
.r-chip svg{width:10px;height:13px;flex:none}
.r-chip.l0 svg{width:12px;height:12px}
.r-chip.l0{color:var(--good);background:var(--good-soft)}
.r-chip.l1,.r-chip.l2{color:var(--warn);background:var(--warn-soft)}
.r-chip.l3{color:var(--leak);background:var(--leak-soft)}
.r-score{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.r-score-top{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.r-score-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.r-meter-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px}
.r-num{display:flex;align-items:baseline;flex:none;font-variant-numeric:tabular-nums}
.r-num b{font-family:var(--f-display);font-size:54px;font-weight:600;line-height:1;letter-spacing:-0.04em;color:var(--accent-text)}
.r-num span{font-size:18px;font-weight:600;color:var(--accent-text)}
.r-num small{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
.r-meter{flex:1;min-width:200px}
.r-ticks{display:flex;gap:2px;height:24px}
.r-ticks i{flex:1;border-radius:2px;background:var(--tick)}
.r-band{background:var(--surface-2);border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:14px}
.r-metric .top{display:flex;align-items:baseline;gap:6px}
.r-metric b{font-family:var(--f-display);font-size:24px;font-weight:600;color:var(--accent-text);font-variant-numeric:tabular-nums}
.r-metric span{font-size:13px;font-weight:600;color:var(--text)}
.r-bar{height:4px;border-radius:99px;background:var(--tick);margin-top:6px;overflow:hidden}
.r-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--accent));transform-origin:left center;animation:grow 700ms var(--ease-out) 250ms backwards}
.r-cta{background:var(--accent);color:#FFFFFF;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.r-cta-eye{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--sky)}
.r-cta-h{font-family:var(--f-display);font-size:clamp(22px,5.6vw,28px);font-weight:800;color:#FFFFFF;line-height:1.12;text-wrap:balance}
.r-cta-p{font-size:16px;color:#E4EEF8;max-width:60ch}
.r-cta-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.r-cta-list li{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:600;color:#FFFFFF}
.r-cta-list svg{flex:none;width:18px;height:18px;color:var(--sky);margin-top:2px}
.r-cta .btn{margin-top:4px}
.btn{text-wrap:balance}
.r-cta-note{font-size:13px;color:#CFE0F1;text-align:center}
details.acc{scroll-margin-top:84px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;color:var(--ink)}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary svg{width:18px;height:18px;flex:none;color:var(--muted);transform:rotate(180deg);transition:transform 200ms var(--ease-out)}
details.acc:not([open]) summary svg{transform:none}
.acc-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.r-p{font-size:16px;color:var(--text);max-width:68ch}
.acc-body .ans:first-of-type{margin-top:0}
.banner{border-radius:16px}
.banner-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sum-text{display:none;width:100%;min-height:150px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.sum-text.show{display:block}
@media (min-width:600px){
  .r-shell{padding:20px;border-radius:36px}
  .r-actions{display:flex;width:auto}
  .r-info{grid-template-columns:repeat(4,1fr)}
  .r-band{grid-template-columns:repeat(3,1fr)}
}

.r-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:15;background:var(--bg);margin-inline:-16px;padding:6px 16px 8px;border-bottom:1px solid var(--line)}
.r-nav-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.r-nav-in::-webkit-scrollbar{display:none}
.r-nav button{flex:none;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;white-space:nowrap;transition:background-color 160ms ease,color 160ms ease,transform 160ms var(--ease-out)}
.r-nav button:active{transform:scale(0.97)}
.r-nav button.on{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.r-nav button.cta{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.r-nav button.cta.on{background:var(--accent);color:#FFFFFF}
#r-overview,.r-cta,.panel{scroll-margin-top:130px}
details.acc{scroll-margin-top:130px!important}
.r-sticky{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform 180ms var(--ease-out)}
.r-sticky.show{transform:none;transition-duration:260ms}
.r-sticky-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.r-sticky-in span{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--ink);line-height:1.3}
.r-sticky .btn{width:auto;min-height:46px;padding:10px 16px;font-size:15px;flex:none}
main.wide{padding-bottom:110px}
@media (max-width:380px){ .r-sticky-in span{display:none} .r-sticky .btn{width:100%} }

@media (prefers-reduced-motion: reduce){
  .screen,.report>*{animation:fade 200ms ease backwards}
  .bar i,.r-bar i,.drip{animation:none}
  .r-sticky{transition:none}
  .conf{transform:none}
}

/* Added for the acceptance checks: 36px secondary tap targets, 48px primary buttons, 16px inputs (no iOS zoom), topbar kept at 64px under the sticky nav, long names wrap. */
.topbar-in{padding-block:10px}
.lang button,.link,.back{min-height:36px}
.r-sticky .btn{min-height:48px}
.codebox input,.sum-text{font-size:16px}
.r-id h1{overflow-wrap:anywhere}
.signup{gap:16px}

/* Readability */
.acc-body .h3,.fix-card .h3{font-size:17px}
.lead,.r-p,.fix-card p,.ans .ae,.small,.tiny,.r-cta-p,.send-steps li,.tile .td,.leak-row .name small,.mist-row .d,.disclaim,.rules li,.err-msg{text-wrap:pretty}
.link{text-decoration-thickness:from-font}
.send-steps svg,.r-cta-list svg{stroke-width:2}
.lvl,.tag,.fix-time,.r-chip{white-space:nowrap}

/* Motion and interaction polish */
.back,.link{transition:transform 160ms var(--ease-out),color 160ms ease}
.back:active,.link:active,.lang button:active{transform:scale(0.97)}
.conf-row .btn.picked{transform:scale(0.97);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--sky)}
.codebox button{min-width:104px}
.lbl{display:inline-block;transition:opacity 120ms ease,filter 120ms ease}
.lbl.out{opacity:0;filter:blur(2px)}
#app.wide .screen{animation-name:fade}
@media (prefers-reduced-motion: no-preference){
  #app[data-enter="q"] .screen{animation:enter-q 200ms var(--ease-out) backwards}
}
@keyframes enter-q{from{opacity:0;transform:translateY(6px)}}
#app[data-enter="none"] .screen,#app[data-enter="none"] .report>*,#app[data-enter="none"] .bar i,#app[data-enter="none"] .r-bar i{animation:none}
</style>

/* ===== REPORT CODE =====
   lt-<12 digits>-<a|e>-<day base36>-<name>
   digit: 0 = didn't know, else 1 + choice*2 + sure. Only plain characters so it survives as a link anchor. */
function encode(){
  const digits = QS.map((q, i) => { const a = S.answers[i]; return !a || a.c < 0 ? 0 : 1 + a.c * 2 + (a.sure ? 1 : 0); }).join("");
  return `lt-${digits}-${S.lang === "af" ? "a" : "e"}-${(S.doneDay || today()).toString(36)}-${cleanName(S.name) || "learner"}`;
}
function decode(text){
  const m = String(text || "").match(/lt-([0-8]{12})-([ae])-([0-9a-z]+)-([A-Za-z0-9]{1,20})/);
  if (!m) return null;
  const answers = m[1].split("").map((ch, i) => {
    const v = +ch; if (v === 0) return { c:-1, sure:false };
    const c = Math.floor((v - 1) / 2), sure = (v - 1) % 2 === 1;
    return c < QS[i].o.length ? { c, sure } : { c:-1, sure:false };
  });
  return { answers, lang: m[2] === "a" ? "af" : "en", day: parseInt(m[3], 36), name: m[4] === "learner" ? "" : m[4] };
}
function reportLink(){ return CONFIG.pageUrl ? `${CONFIG.pageUrl}#${encode()}` : ""; }

/* ===== ANALYSIS ===== */
function analyse(){
  const cnt = { solid:0, shaky:0, misc:0, gap:0 }, mist = { sign:0, rule:0, step:0, read:0 }, per = {};
  Object.keys(TOPICS).forEach(k => per[k] = []);
  const rows = QS.map((q, i) => {
    const a = S.answers[i] || { c:-1, sure:false }; let cat, pts;
    if (a.c >= 0 && q.o[a.c].ok){ cat = a.sure ? "solid" : "shaky"; pts = a.sure ? 1 : 0.5; }
    else if (a.c >= 0){ cat = a.sure ? "misc" : "gap"; pts = 0; mist[q.o[a.c].m]++; }
    else { cat = "gap"; pts = 0; }
    cnt[cat]++; per[q.t].push({ pts, cat }); return { q, a, cat };
  });
  const topics = Object.keys(per).map(k => {
    const leak = 1 - per[k].reduce((s, x) => s + x.pts, 0) / per[k].length;
    return { k, leak, level: leak >= 0.75 ? 3 : leak >= 0.5 ? 2 : leak >= 0.25 ? 1 : 0, misc: per[k].filter(x => x.cat === "misc").length, gap: per[k].filter(x => x.cat === "gap").length };
  }).sort((a, b) => b.leak - a.leak || b.misc - a.misc);
  const correct = cnt.solid + cnt.shaky;
  const nonWordCorrect = rows.filter(r => r.q.t !== "word" && (r.cat === "solid" || r.cat === "shaky")).length;
  const wordWrong = per.word.filter(x => x.pts === 0).length;
  let type;
  if (cnt.solid >= 10) type = "E";
  else if (wordWrong === 2 && nonWordCorrect >= 8) type = "D";
  else if (cnt.misc >= 2 && cnt.misc >= cnt.shaky) type = "A";
  else if (cnt.gap >= 3) type = "B";
  else if (cnt.shaky >= 3) type = "C";
  else { const m = Math.max(cnt.misc, cnt.gap, cnt.shaky); type = m === cnt.misc && m > 0 ? "A" : m === cnt.gap && m > 0 ? "B" : "C"; }
  return { cnt, mist, topics, rows, correct, type, leaking: topics.filter(t => t.level > 0) };
}

function drops(level){
  const c = level === 3 ? col("--leak") : level > 0 ? col("--warn") : col("--good");
  let s = "";
  for (let k = 0; k < 3; k++) s += DROP(level === 0 ? (k === 0 ? col("--good-soft") : col("--drop-empty")) : (k < level ? c : col("--drop-empty")));
  return `<span class="drops">${s}</span>`;
}

function mixHex(a, b, t){
  const p = (h) => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function ticks(pct){
  const N = 64, on = Math.round(N * pct), s = col("--sky"), a = col("--accent");
  let h = "";
  for (let k = 0; k < N; k++) h += k < on ? `<i style="background:${mixHex(s, a, on > 1 ? k / (on - 1) : 1)}"></i>` : "<i></i>";
  return `<div class="r-ticks" role="img" aria-label="${Math.round(pct * 100)}%">${h}</div>`;
}

function navBar(){
  const items = [["r-overview",L("Overview","Oorsig")],["leaks",L("Leaks","Lekke")],["sure",L("Sure vs right","Seker teenoor reg")],["mistakes",L("Mistakes","Foute")],["fixplan",L("Quick wins","Vinnige wenke")],["answers",L("Working","Uitwerking")]];
  if (!S.shared) items.push(["help",L("Programme","Program")]);

}

function stickyBar(R){
  return `<div class="r-sticky" id="r-sticky" aria-hidden="true">
    <div class="r-sticky-in">
      <span>${L("Want better marks this term?","Wil jy hierdie kwartaal beter punte hê?")}</span>

}

function lessonFocus(R){

  return top

        `Begin les 1 by ${lower(tName(top.k))}${top.misc ? `: ${top.misc}x verkeerd maar seker, so herleer eers die reël.` : top.gap ? `: 'n gat, so bou dit van die basis af op.` : "."}`)
    : L("Foundations held. Start lesson 1 on current Term 4 work and exam technique.","Die grondslag het gehou. Begin les 1 by huidige Kwartaal 4-werk en eksamentegniek.");

function summaryText(R){

  return [
    `Mark Leak Finder · ${S.name || L("Learner","Leerder")}`,

    `${L("Next step","Volgende stap")}: ${lessonFocus(R)}`
  ].join("\n");
}

function sharedBanner(R){
  return `<div class="banner">
    <div class="banner-top">
      <p class="eyebrow">${L("LocalTutors view","LocalTutors-aansig")}</p>

    </div>

    <p class="meta">${L("Finished","Voltooi")} ${fmtDay(S.doneDay)} · ${L("Answered in","Beantwoord in")} ${S.shared.lang === "af" ? "Afrikaans" : L("English","Engels")} · ${R.correct}/12 ${L("right","reg")}</p>

function waLink(R){
  const link = reportLink();
  const lines = [
    L("Hi LocalTutors! I did the Mark Leak Finder and would like you to work out a 4-week programme for me.","Hi LocalTutors! Ek het die Mark Leak Finder gedoen en wil graag hê julle moet 'n 4-weke program vir my uitwerk."),

    `${L("Result","Uitslag")}: ${TYPES[R.type].t()}`,

    `${L("Score","Punt")}: ${R.correct}/12 ${L("right","reg")} (${R.cnt.solid} ${L("right and sure","reg en seker")})`,
    `${L("Code","Kode")}: ${encode()}`
  ];
  return `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(lines.join("\n"))}`;
}

/* ===== SAVING =====
   Sign-ups go to Supabase when CONFIG has a URL and key. The tables accept new rows only, nobody can read them
   back through this key. A failed save never stops the learner. */
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
function post(table, row){
  if (!CONFIG.supabaseUrl || !CONFIG.supabaseKey) return Promise.resolve(false);
  const headers = { "Content-Type":"application/json", apikey: CONFIG.supabaseKey, Prefer:"return=minimal" };
  if (CONFIG.supabaseKey.startsWith("eyJ")) headers.Authorization = "Bearer " + CONFIG.supabaseKey;
  const send = () => fetch(`${CONFIG.supabaseUrl.replace(/\/$/, "")}/rest/v1/${table}`, { method:"POST", headers, body: JSON.stringify(row), keepalive:true }).then(r => r.ok);
  return send().catch(() => false).then(ok => ok || new Promise(res => setTimeout(res, 1500)).then(send).catch(() => false));
}
function saveLead(){
  S.leadId = uuid(); S.saved = "";
  S.leadSave = post("leads", { id:S.leadId, child_name:S.name, parent_name:S.parent, email:S.email, whatsapp:S.wa || null, lang:S.lang });
}
function saveResult(R){
  if (S.shared || !S.leadId || S.saved === S.leadId) return;
  S.saved = S.leadId;
  const row = { lead_id:S.leadId, report_code:encode(), result_type:R.type, right_answers:R.correct, right_and_sure:R.cnt.solid,
                score:+((R.cnt.solid + R.cnt.shaky * 0.5) / 12 * 100).toFixed(2), biggest_leak:R.leaking[0] ? R.leaking[0].k : null, lang:S.lang };
  Promise.resolve(S.leadSave).then(() => post("lead_results", row));
}

/* ===== WIRING ===== */
let spy = null, timers = [], anStart = 0, busy = false, ticking = false, lastView = "", spyLock = false, spyRefresh = null;
const motion = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
const $ = (id) => document.getElementById(id);

function render(top){
  timers.forEach(clearTimeout); timers = [];
  if (spy){ spy.disconnect(); spy = null; }
  spyRefresh = null; unlockSpy();
  document.querySelectorAll("body > .r-sticky").forEach(el => el.remove());
  const app = $("app");
  /* Entry motion only when the view changes: a language switch or an error message is not an entrance. */
  const view = S.screen + (S.screen === "q" ? S.qi : "") + (S.shared ? "s" : "");
  app.dataset.enter = view === lastView ? "none" : S.screen === "q" && lastView.startsWith("q") ? "q" : "";
  lastView = view;
  app.innerHTML = S.screen === "welcome" ? vWelcome() : S.screen === "q" ? vQ() : S.screen === "analysing" ? vAnalysing() : vReport();
  app.classList.toggle("wide", S.screen === "report");
  document.documentElement.lang = S.lang;
  document.querySelectorAll(".lang button").forEach(b => { const on = b.dataset.l === S.lang; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  document.querySelector(".lang").setAttribute("aria-label", L("Language","Taal"));
  if (top) window.scrollTo(0, 0);
  if (S.screen === "analysing") startAnalysing();
  if (S.screen === "report"){ wireReport(); if (!S.shared) saveResult(analyse()); }
}

function startAnalysing(){
  const gone = Date.now() - anStart;
  for (let k = 0; k < 4; k++){
    const tick = () => { const it = $("an" + k); if (it) it.classList.add("done"); };
    const wait = 320 + 360 * k - gone;
    if (wait <= 0) tick(); else timers.push(setTimeout(tick, wait));
  }
  timers.push(setTimeout(() => { S.screen = "report"; render(true); }, Math.max(0, 2000 - gone)));
}

function wireReport(){
  /* The animated .screen would become the containing block of a fixed element, so the sticky bar lives on body. */
  const bar = $("r-sticky");
  if (bar) document.body.appendChild(bar);
  const nav = document.querySelector(".r-nav-in");
  if (nav){
    const chips = [...nav.querySelectorAll("button")], ids = chips.map(b => b.dataset.to), vis = new Set();
    spy = new IntersectionObserver(es => {
      es.forEach(e => e.isIntersecting ? vis.add(e.target.id) : vis.delete(e.target.id));
      if (!spyLock) spyRefresh();
    }, { rootMargin: "-130px 0px -55% 0px" });
    spyRefresh = () => { const cur = ids.find(id => vis.has(id)); if (cur) setChip(cur); };
    ids.forEach(id => { const el = $(id); if (el) spy.observe(el); });
  }
  checkSticky();
}

function setChip(cur){
  const nav = document.querySelector(".r-nav-in");
  if (!nav) return;
  nav.querySelectorAll("button").forEach(b => {
    const on = b.dataset.to === cur;
    if (on && !b.classList.contains("on")) nav.scrollTo({ left: b.offsetLeft - nav.offsetLeft - (nav.clientWidth - b.offsetWidth) / 2, behavior: motion() });
    b.classList.toggle("on", on);
    if (on) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
  });
}
/* After a jump, keep the chip that was asked for (no flicking through every section on the way)
   until the learner scrolls by hand again. */
const INTENT = ["wheel", "touchstart", "keydown"];
function unlockSpy(){
  INTENT.forEach(ev => window.removeEventListener(ev, unlockSpy));
  if (spyLock){ spyLock = false; if (spyRefresh) spyRefresh(); }
}
function lockSpy(){
  spyLock = true;
  INTENT.forEach(ev => window.addEventListener(ev, unlockSpy, { passive:true }));
}

/* Sticky bar: requestAnimationFrame scroll check. Shown after 500px, hidden while either CTA is on screen. */
function checkSticky(){
  ticking = false;
  const bar = $("r-sticky");
  if (!bar) return;
  const seen = (id) => { const el = $(id); if (!el) return false; const r = el.getBoundingClientRect(); return r.top < innerHeight && r.bottom > 0; };
  const show = window.scrollY > 500 && !seen("help-top") && !seen("help");
  if (show === bar.classList.contains("show")) return;
  bar.classList.toggle("show", show);
  bar.setAttribute("aria-hidden", String(!show));
  bar.querySelector("a").tabIndex = show ? 0 : -1;
}
const onScroll = () => { if (!ticking){ ticking = true; requestAnimationFrame(checkSticky); } };
window.addEventListener("scroll", onScroll, { passive:true });
window.addEventListener("resize", onScroll);

function next(){
  if (S.qi < QS.length - 1){ S.qi++; S.screen = "q"; }
  else { S.doneDay = today(); anStart = Date.now(); S.screen = "analysing"; unguard(); }
  render(true);
}

/* While the questions are on screen, one extra history entry makes the phone's Back gesture
   go to the previous question instead of leaving the page and losing every answer. */
let guarded = false, skipPop = false;
function guard(){ if (!guarded){ history.pushState({ mlf:1 }, ""); guarded = true; } }
function unguard(){ if (guarded){ guarded = false; skipPop = true; history.back(); } }
window.addEventListener("popstate", () => {
  if (skipPop){ skipPop = false; return; }
  if (!guarded || S.screen !== "q") return;
  guarded = false;
  if (busy){ guard(); return; }
  if (S.qi > 0){ S.qi--; render(true); guard(); }
  else { S.screen = "welcome"; render(true); }
});
function advance(){ busy = true; setTimeout(() => { busy = false; next(); }, 140); }

/* Copy feedback: the button keeps its width and the label crossfades, so the code field never shifts. */
function swapLabel(btn, text){
  let lbl = btn.querySelector(".lbl");
  if (!lbl){ btn.dataset.orig = btn.textContent; btn.innerHTML = `<span class="lbl">${esc(btn.textContent)}</span>`; lbl = btn.firstChild; }
  btn.style.minWidth = btn.offsetWidth + "px";
  lbl.classList.add("out");
  setTimeout(() => { lbl.textContent = text; lbl.classList.remove("out"); }, 120);
}
async function copyText(text, btn, fallback){
  clearTimeout(btn._restore);
  try { await navigator.clipboard.writeText(text); swapLabel(btn, L("Copied","Gekopieer")); }
  catch (err) { fallback(); swapLabel(btn, L("Selected","Gekies")); }
  btn._restore = setTimeout(() => swapLabel(btn, btn.dataset.orig), 1600);
}

function openShared(d){
  Object.assign(S, { shared:{ lang:d.lang }, lang:d.lang, answers:d.answers, name:d.name, doneDay:d.day, screen:"report", pasteOpen:false, errs:{} });
  render(true);
}
function fromHash(){
  let h = location.hash.slice(1);
  if (!h) return false;
  try { h = decodeURIComponent(h); } catch (err) { return false; }
  const d = decode(h);
  if (!d) return false;
  openShared(d);
  return true;
}

function start(){
  [["nm","name"],["pn","parent"],["em","email"],["wa","wa"]].forEach(([id, k]) => { const el = $(id); if (el) S[k] = el.value; });
  S.errs = checkSignup();
  const first = ["nm","pn","em","wa"].find(k => S.errs[k]);
  if (first){ render(false); $(first).focus(); return; }
  S.name = S.name.trim(); S.parent = S.parent.trim(); S.email = S.email.trim(); S.wa = S.wa.trim();
  saveLead();
  Object.assign(S, { qi:0, screen:"q" });
  render(true);
  guard();
}
function openCode(){
  const d = decode($("pc").value);
  if (!d){ $("pc").classList.add("err"); $("pc-err").hidden = false; return; }
  openShared(d);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  switch (t.dataset.act){
    case "lang": if (S.lang !== t.dataset.l){ S.lang = t.dataset.l; render(false); } break;
    case "start": start(); break;
    case "back":
      if (busy) return;
      if (S.qi > 0) S.qi--; else { S.screen = "welcome"; unguard(); }
      render(true); break;
    case "choose": {
      if (busy) return;
      S.answers[S.qi] = { c:+t.dataset.j, sure:null };
      document.querySelectorAll("#opts .opt").forEach(b => b.classList.toggle("sel", b === t));
      const conf = $("conf");
      conf.classList.add("show");
      if (innerWidth < 700) conf.scrollIntoView({ behavior: motion(), block:"nearest" });
      break;
    }
    case "sure": {
      const a = S.answers[S.qi];
      if (busy || !a || a.c < 0) return;
      a.sure = t.dataset.v === "1";
      t.classList.add("picked");
      advance(); break;
    }
    case "idk":
      if (busy) return;
      S.answers[S.qi] = { c:-1, sure:false };
      document.querySelectorAll("#opts .opt").forEach(b => b.classList.toggle("sel", b === t));
      $("conf").classList.remove("show");
      advance(); break;
    case "jump": {
      const el = $(t.dataset.to);
      if (!el) return;
      if (el.tagName === "DETAILS") el.open = true;
      if (document.querySelector(`.r-nav [data-to="${t.dataset.to}"]`)){ setChip(t.dataset.to); lockSpy(); }
      el.scrollIntoView({ behavior: motion(), block:"start" });
      break;
    }
    case "copy": {
      const inp = $("code");
      copyText(inp.value, t, () => { inp.focus(); inp.select(); inp.setSelectionRange(0, inp.value.length); });
      break;
    }
    case "copy-summary": {
      const ta = $("sum-text");
      copyText(ta.value, t, () => { ta.classList.add("show"); ta.removeAttribute("aria-hidden"); ta.tabIndex = 0; ta.focus(); ta.select(); });
      break;
    }
    case "toggle-paste":
      S.pasteOpen = !S.pasteOpen; render(false);
      if (S.pasteOpen) $("pc").focus();
      break;
    case "open-code": openCode(); break;
    case "restart":
      Object.assign(S, { screen:"welcome", qi:0, name:"", answers:[], shared:null, doneDay:null, pasteOpen:false, errs:{}, leadId:"", saved:"" });
      history.replaceState(null, "", location.pathname + location.search);
      render(true); break;
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.dataset && e.target.dataset.field){
    e.preventDefault();
    const order = ["nm","pn","em","wa"], nextField = $(order[order.indexOf(e.target.id) + 1]);
    if (nextField) nextField.focus(); else start();
  }
  else if (e.target.id === "pc"){ e.preventDefault(); openCode(); }
});

document.addEventListener("input", (e) => {
  const t = e.target;
  const k = t.dataset && t.dataset.field;
  if (k){
    S[{ nm:"name", pn:"parent", em:"email", wa:"wa" }[k]] = t.value;
    if (S.errs[k] && !checkSignup()[k]){
      delete S.errs[k]; t.classList.remove("err"); t.removeAttribute("aria-invalid");
      const m = $(k + "-err"); if (m) m.remove();
    }
  } else if (t.id === "pc"){ t.classList.remove("err"); $("pc-err").hidden = true; }
});

window.addEventListener("hashchange", fromHash);
if (!fromHash()) render(true);
</script>
