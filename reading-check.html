<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Check, free assessment, LocalTutors Upington</title>
<meta name="description" content="A free 3 minute reading screening for Grade 3 to 6 learners. Answer 10 quick questions and get an instant, personalised result.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F0EB;
    --card:#FFFFFF;
    --blue:#2563A6;
    --blue-dark:#1B4A7C;
    --gold:#C98A2B;
    --gold-dark:#9C6A1D;
    --ink:#111111;
    --body:#1F2933;
    --muted:#4A5560;
    --green:#1A5C38;
    --orange:#BF4E0A;
    --red:#8C2020;
    --radius:18px;
    --shadow-1: 0 1px 2px rgba(17,17,17,0.06), 0 8px 24px rgba(17,17,17,0.08);
  }

  *,*::before,*::after{box-sizing:border-box;}

  html{
    -webkit-text-size-adjust:100%;
  }

  body{
    margin:0;
    background:var(--paper);
    color:var(--body);
    font-family:'Nunito Sans', system-ui, -apple-system, sans-serif;
    font-size:16px;
    line-height:1.5;
    overscroll-behavior-y: contain;
    min-height:100dvh;
    min-height:100vh;
  }

  h1,h2,h3,.font-head{
    font-family:'Manrope', system-ui, -apple-system, sans-serif;
    color:var(--ink);
    margin:0;
  }

  p{margin:0;}

  a{color:var(--blue);}

  button{font-family:inherit;}

  svg{display:block;}

  /* ---------- focus states ---------- */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  .tap-btn:focus-visible,
  label.checkbox-row:focus-within{
    outline:3px solid var(--blue);
    outline-offset:2px;
  }

  /* Headings are given tabindex="-1" purely so focus can move to them for
     screen reader announcement on screen change. They are not part of the
     tab order, so no visible ring is needed here. */
  h1[tabindex="-1"]:focus,
  h2[tabindex="-1"]:focus{
    outline:none;
  }

  input:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 4px rgba(37,99,166,0.18);
  }

  /* ---------- layout scaffold ---------- */
  .page-wrap{
    min-height:100dvh;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 40px;
  }

  header.site-header{
    width:100%;
    max-width:640px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }

  .wordmark{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:1.35rem;
    letter-spacing:-0.01em;
  }
  .wordmark .t-local{color:var(--ink);}
  .wordmark .t-tutors{color:var(--blue);}

  .header-sub{
    font-size:0.78rem;
    color:var(--muted);
    font-weight:600;
  }

  .book-stage{
    position:relative;
    width:100%;
    max-width:640px;
  }

  /* stacked page effect behind the card */
  .book-stage::before,
  .book-stage::after{
    content:"";
    position:absolute;
    left:50%;
    right:0;
    top:8px;
    bottom:-8px;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow-1);
    transform-origin:top center;
    pointer-events:none;
  }
  .book-stage::before{
    transform:translateX(-50%) rotate(-1.6deg);
    top:10px;
    opacity:0.75;
  }
  .book-stage::after{
    transform:translateX(-50%) rotate(1.3deg);
    top:6px;
    opacity:0.55;
  }

  .book-card{
    position:relative;
    z-index:1;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow-1);
    overflow:hidden;
  }

  /* ribbon progress bar */
  .ribbon-track{
    height:8px;
    width:100%;
    background:#EFE6D3;
    position:relative;
    overflow:hidden;
  }
  .ribbon-fill{
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, var(--gold-dark), var(--gold));
    transform-origin:left center;
    transform:scaleX(0);
    transition:transform 0.45s cubic-bezier(.4,0,.2,1);
  }
  .ribbon-fill.hide{visibility:hidden;}

  .card-inner{
    padding:28px 24px 30px;
  }
  @media (min-width:480px){
    .card-inner{padding:38px 40px 40px;}
  }

  /* ---------- screen transition ---------- */
  .screen{
    animation: page-in 0.38s ease-out both;
  }
  @keyframes page-in{
    from{opacity:0; transform:translateX(28px);}
    to{opacity:1; transform:translateX(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .screen{animation:none;}
    .ribbon-fill{transition:none;}
    *{scroll-behavior:auto !important;}
  }

  /* ---------- typography helpers ---------- */
  .eyebrow{
    display:inline-block;
    font-size:0.72rem;
    font-weight:800;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#7A5216;
    background:#FBF1DF;
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:14px;
  }

  h1.headline{
    font-size:1.55rem;
    line-height:1.28;
    font-weight:800;
    margin-bottom:12px;
  }
  @media (min-width:480px){
    h1.headline{font-size:1.85rem;}
  }

  h2.headline{
    font-size:1.35rem;
    line-height:1.3;
    font-weight:800;
    margin-bottom:10px;
  }

  .subhead{
    color:var(--muted);
    font-size:1rem;
    margin-bottom:22px;
  }

  /* ---------- value prop list ---------- */
  .value-list{
    list-style:none;
    margin:0 0 26px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .value-list li{
    display:flex;
    gap:12px;
    align-items:flex-start;
    background:var(--paper);
    border-radius:12px;
    padding:14px;
    font-size:0.94rem;
    color:var(--body);
  }
  .value-list .icon-wrap{
    flex:none;
    width:30px;height:30px;
    border-radius:8px;
    background:#E4EDF6;
    color:var(--blue);
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    border:none;
    border-radius:12px;
    padding:15px 20px;
    font-size:1rem;
    font-weight:800;
    font-family:'Manrope', sans-serif;
    cursor:pointer;
    transition:background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    text-decoration:none;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:var(--blue);
    color:#fff;
  }
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-primary:disabled{
    background:#9AB4CC;
    cursor:not-allowed;
    transform:none;
  }
  .btn-secondary{
    background:#fff;
    color:var(--blue);
    border:2px solid var(--blue);
    padding:13px 20px;
  }
  .btn-secondary:hover{background:#EAF1F8;}

  .btn-text{
    background:none;
    border:none;
    color:var(--muted);
    font-weight:700;
    font-size:0.92rem;
    cursor:pointer;
    padding:10px 4px;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn-text:hover{color:var(--blue);}

  /* meta pills */
  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:16px;
    justify-content:center;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--paper);
    border-radius:999px;
    padding:7px 12px;
    font-size:0.78rem;
    font-weight:700;
    color:var(--muted);
  }
  .pill svg{width:14px;height:14px;color:var(--blue);}

  /* ---------- credibility page ---------- */
  .avatar-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
  }
  .avatar-circle{
    flex:none;
    width:48px;height:48px;
    border-radius:50%;
    background:var(--blue);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:1rem;
  }
  .avatar-name{font-weight:800; color:var(--ink); font-size:0.95rem;}
  .avatar-role{font-size:0.82rem; color:var(--muted);}

  .quote-block{
    font-size:0.98rem;
    color:var(--body);
    background:var(--paper);
    border-left:3px solid var(--gold);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:22px;
  }

  .results-checklist{
    list-style:none;
    margin:0 0 22px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .results-checklist li{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:0.92rem;
  }
  .results-checklist .check-icon{
    flex:none;
    width:20px;height:20px;
    color:var(--green);
    margin-top:2px;
  }

  .approach-block{
    font-size:0.92rem;
    color:var(--muted);
    margin-bottom:24px;
  }

  .cta-caption{
    text-align:center;
    font-size:0.82rem;
    color:var(--muted);
    margin-top:10px;
  }

  /* ---------- form fields ---------- */
  .field{
    margin-bottom:20px;
  }
  .field label{
    display:block;
    font-weight:700;
    font-size:0.9rem;
    color:var(--ink);
    margin-bottom:7px;
  }
  .field .optional-tag{
    font-weight:600;
    color:var(--muted);
    font-size:0.78rem;
    text-transform:none;
  }
  .field input[type="text"],
  .field input[type="email"],
  .field input[type="tel"]{
    width:100%;
    border:2px solid #D8D3C7;
    border-radius:10px;
    padding:13px 14px;
    font-size:1rem;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input.has-error{
    border-color:var(--red);
  }
  .field-error{
    color:var(--red);
    font-size:0.82rem;
    font-weight:700;
    margin-top:6px;
    display:none;
  }
  .field-error.show{display:block;}

  .grade-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .grade-btn{
    border:2px solid #D8D3C7;
    background:#fff;
    border-radius:12px;
    padding:16px 10px;
    font-weight:800;
    font-family:'Manrope',sans-serif;
    font-size:0.98rem;
    color:var(--ink);
    cursor:pointer;
    transition:border-color 0.15s ease, background-color 0.15s ease;
  }
  .grade-btn:hover{border-color:var(--blue);}
  .grade-btn.selected{
    border-color:var(--blue);
    background:#EAF1F8;
    color:var(--blue-dark);
  }

  .checkbox-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:0.88rem;
    color:var(--body);
    cursor:pointer;
    border-radius:8px;
    padding:4px;
  }
  .checkbox-row input[type="checkbox"]{
    flex:none;
    width:20px;height:20px;
    margin-top:1px;
    accent-color:var(--blue);
  }

  .form-summary-error{
    color:var(--red);
    font-weight:700;
    font-size:0.85rem;
    margin-top:4px;
    margin-bottom:12px;
    display:none;
    text-align:center;
  }
  .form-summary-error.show{display:block;}

  /* ---------- question screens ---------- */
  .q-progress-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    gap:10px;
    flex-wrap:wrap;
  }
  .q-progress-label{
    font-size:0.78rem;
    font-weight:800;
    color:var(--muted);
    letter-spacing:0.02em;
  }
  .q-section-tag{
    font-size:0.72rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--blue);
    background:#EAF1F8;
    padding:4px 10px;
    border-radius:999px;
  }

  h2.q-text{
    font-size:1.2rem;
    line-height:1.35;
    font-weight:800;
    margin:14px 0 20px;
  }
  @media (min-width:480px){
    h2.q-text{font-size:1.35rem;}
  }

  .options-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:22px;
  }

  .tap-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    width:100%;
    text-align:left;
    border:2px solid #D8D3C7;
    background:#fff;
    border-radius:12px;
    padding:15px 16px;
    font-size:0.96rem;
    font-weight:700;
    color:var(--body);
    cursor:pointer;
    transition:border-color 0.15s ease, background-color 0.15s ease;
  }
  .tap-btn:hover{border-color:var(--blue);}
  .tap-btn.selected{
    border-color:var(--blue);
    background:#EAF1F8;
    color:var(--blue-dark);
  }

  .tap-check{
    flex:none;
    width:24px;height:24px;
    border-radius:50%;
    border:2px solid #D8D3C7;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    transition:border-color 0.15s ease, background-color 0.15s ease;
  }
  .tap-btn.selected .tap-check{
    border-color:var(--blue);
    background:var(--blue);
  }
  .tap-check svg{
    width:14px;height:14px;
    transform:scale(0);
    transition:transform 0.32s cubic-bezier(.34,1.56,.64,1);
  }
  .tap-btn.selected .tap-check svg{
    transform:scale(1);
  }
  @media (prefers-reduced-motion: reduce){
    .tap-check svg{transition:none;}
  }

  .nav-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .nav-row .btn-primary{width:auto; flex:1;}

  /* ---------- result page ---------- */
  .band-strip{
    display:flex;
    gap:6px;
    margin-bottom:22px;
  }
  .band-seg{
    flex:1;
    height:8px;
    border-radius:999px;
    background:#E4E0D4;
    opacity:0.4;
    transition:opacity 0.2s ease;
  }
  .band-seg.active-green{background:var(--green); opacity:1;}
  .band-seg.active-orange{background:var(--orange); opacity:1;}
  .band-seg.active-red{background:var(--red); opacity:1;}

  .result-heading{
    font-size:1.4rem;
    font-weight:800;
    margin-bottom:10px;
    line-height:1.3;
  }
  .result-heading.green{color:var(--green);}
  .result-heading.orange{color:var(--orange);}
  .result-heading.red{color:var(--red);}

  .result-body{
    color:var(--body);
    font-size:0.96rem;
    margin-bottom:24px;
  }

  .insight-card{
    background:var(--paper);
    border-radius:12px;
    padding:16px;
    display:flex;
    gap:12px;
    margin-bottom:12px;
  }
  .insight-num{
    flex:none;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--blue);
    color:#fff;
    font-weight:800;
    font-size:0.82rem;
    display:flex;align-items:center;justify-content:center;
    font-family:'Manrope',sans-serif;
  }
  .insight-text{font-size:0.9rem; color:var(--body);}

  .result-actions{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:24px;
  }

  .confirm-msg{
    background:#EAF1F8;
    color:var(--blue-dark);
    border-radius:10px;
    padding:14px;
    font-size:0.9rem;
    font-weight:600;
    margin-top:14px;
    display:none;
  }
  .confirm-msg.show{display:block;}

  .disclaimer-box{
    margin-top:26px;
    padding:14px 16px;
    background:#F7F1E3;
    border-radius:10px;
    font-size:0.82rem;
    color:var(--muted);
    line-height:1.5;
  }

  .contact-footer{
    margin-top:22px;
    padding-top:20px;
    border-top:1px solid #E6E1D4;
    display:flex;
    flex-direction:column;
    gap:8px;
    font-size:0.88rem;
  }
  .contact-footer a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--body);
    font-weight:700;
    text-decoration:none;
  }
  .contact-footer a:hover{color:var(--blue);}
  .contact-footer svg{width:17px;height:17px;color:var(--blue); flex:none;}

  .start-over-row{
    text-align:center;
    margin-top:20px;
  }

  .visually-hidden{
    position:absolute;
    width:1px;height:1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
  }

  footer.page-footer{
    max-width:640px;
    width:100%;
    text-align:center;
    color:var(--muted);
    font-size:0.76rem;
    margin-top:22px;
    padding:0 8px;
  }
</style>
</head>
<body>

<div class="page-wrap">
  <header class="site-header">
    <div class="wordmark"><span class="t-local">Local</span><span class="t-tutors">Tutors</span></div>
    <div class="header-sub">Reading check for Grade 3 to 6</div>
  </header>

  <div class="book-stage">
    <div class="book-card">
      <div class="ribbon-track" id="ribbonTrack">
        <div class="ribbon-fill" id="ribbonFill"></div>
      </div>
      <div class="card-inner" id="cardInner">
        <!-- screens injected here by JS -->
      </div>
    </div>
  </div>

  <footer class="page-footer">
    LocalTutors, Upington. This screening tool does not store your answers anywhere except in this browser session, until you choose to submit.
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     Icon library (inline SVG, stroke style, currentColor)
     ========================================================= */
  var ICONS = {
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>',
    tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24L3 3l.24 6.59a2 2 0 0 0 .58 1.41l9.58 9.58a2 2 0 0 0 2.83 0l6.59-6.59a2 2 0 0 0-.24-2.58z"></path><circle cx="7.5" cy="7.5" r="1.25"></circle></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>',
    target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>',
    compass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m14.5 9.5-2 5-4 1.5 2-5z"></path></svg>',
    signpost: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"></path><path d="M12 6h6l2 2-2 2h-6"></path><path d="M12 12H7l-2 2 2 2h5"></path></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"></path></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 6-10 7L2 6"></path></svg>',
    arrowLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>'
  };

  /* =========================================================
     Question bank
     ========================================================= */
  var FREQ_OPTS = ["Never","Rarely","Sometimes","Often","Very often"];

  var QUESTIONS = [
    {
      id:"q1", section:"Reading check", area:null,
      text:"When your child reads aloud, how often do they struggle to read words smoothly or pause for a long time?",
      options: FREQ_OPTS
    },
    {

  function fetchLocationSilently(){

        .then(function(res){ return res.ok ? res.json() : null; })
        .then(function(data){
          if(data){
            state.location = {
              city: data.city || null,
              region: data.region || null,
              country: data.country_name || null,
              ip: data.ip || null
            };
          }
        })
        .catch(function(){ /* fail silently, never block the flow */ });
    }catch(e){ /* fail silently */ }

  /* =========================================================

  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  function setRibbon(fraction, visible){
    if(!visible){
      ribbonTrack.style.display = "none";
      return;
    }
    ribbonTrack.style.display = "";
    ribbonFill.style.transform = "scaleX(" + fraction + ")";
  }

  function render(){
    cardInner.innerHTML = "";

    if(state.screen === "hook"){
      setRibbon(0,false);
      screenEl = renderHook();
    } else if(state.screen === "credibility"){
      setRibbon(0,false);
      screenEl = renderCredibility();
    } else if(state.screen === "details"){
      setRibbon(0,false);
      screenEl = renderDetails();
    } else if(state.screen === "question"){
      var total = QUESTIONS.length;
      setRibbon((state.qIndex+1)/total, true);
      screenEl = renderQuestion(state.qIndex);
    } else if(state.screen === "result"){
      setRibbon(1,true);
      screenEl = renderResult();
    }
    cardInner.appendChild(screenEl);
    // move focus to the new screen heading for keyboard/SR users
    var heading = screenEl.querySelector("h1,h2");
    if(heading){
      heading.setAttribute("tabindex","-1");
      heading.focus({preventScroll:true});

  /* =========================================================

     ========================================================= */
  var FREQ_SCORE = { "Never":0, "Rarely":1, "Sometimes":2, "Often":3, "Very often":4 };
  var Q10_SCORE = {
    "They are ahead of most children":0,
    "They are about where I would expect":1,
    "I'm not sure":2,
    "They are slightly behind":3,
    "They are significantly behind":4
  };

  function computeScore(){
    var total = 0;
    var highCount = 0; // count of Q1-Q10 scoring 3 or 4
    var areaScores = {}; // area -> summed score, from Q2-Q10

    for(var i=0;i<10;i++){
      var q = QUESTIONS[i];
      var answer = state.answers[q.id];
      var score;
      if(q.id === "q10"){
        score = Q10_SCORE.hasOwnProperty(answer) ? Q10_SCORE[answer] : 0;
      } else {
        score = FREQ_SCORE.hasOwnProperty(answer) ? FREQ_SCORE[answer] : 0;
      }
      total += score;
      if(score >= 3) highCount++;
      if(i >= 1 && q.area){ // Q2-Q10 -> index 1..9
        areaScores[q.area] = (areaScores[q.area] || 0) + score;
      }
    }

    var band;
    if(total <= 12) band = "green";
    else if(total <= 23) band = "orange";
    else band = "red";

    if(highCount >= 2 && band === "green") band = "orange";
    if(highCount >= 5) band = "red";

    // find top area
    var topArea = null, topScore = -1, tie = false;
    Object.keys(areaScores).forEach(function(area){
      if(areaScores[area] > topScore){
        topScore = areaScores[area];
        topArea = area;
        tie = false;
      } else if(areaScores[area] === topScore){
        tie = true;
      }
    });
    // require some meaningful signal, not just "anything above zero counts as standing out"
    if(topScore <= 0 || tie){
      topArea = null;
    }

    return { total: total, band: band, highCount: highCount, topArea: topArea, areaScores: areaScores };
  }

        bookBtn.disabled = true;
        bookBtn.textContent = "Sending...";
        window.setTimeout(function(){
          submitBooking(scoring);
          bookBtn.textContent = "Request sent";
          wrap.querySelector("#confirmMsg").classList.add("show");
        }, 1100);
      });
    }

    wrap.querySelector("#startOverBtn").addEventListener("click", function(){
      resetFlow();
    });

    return wrap;
  }

  function submitBooking(scoring){
    submissionSent = true;
    var payload = {
      submittedAt: new Date().toISOString(),
      parent: state.parent,
      location: state.location,
      score: {
        total: scoring.total,
        band: scoring.band,
        topArea: scoring.topArea,
        areaScores: scoring.areaScores
      },
      answers: QUESTIONS.map(function(q){
        return { id: q.id, question: q.text, answer: state.answers[q.id] || null, section: q.section };
      })
    };
    // TODO: once a backend exists, POST this payload there so it can email
    // localtutors.upington@gmail.com with the new lead and result details.
    console.log("LocalTutors Reading Check submission:", payload);
  }

  /* =========================================================
     Reset
     ========================================================= */
  function resetFlow(){
    state.screen = "hook";
    state.qIndex = 0;
    state.parent = { name:"", email:"", grade:"", phone:"", consent:false };
    state.answers = {};
    submissionSent = false;
    render();
  }

  /* =========================================================
     Init
     ========================================================= */
  render();
})();
</script>
</body>
</html>
