          point: { arms: [[[0, -400], [-92, -392], [-188, -404]], [[0, -400], [26, -300], [36, -205]]], hands: [[-188, -404], [36, -205]], look: "left", mood: "happy" },
          tired: { arms: [[[0, -390], [-34, -290], [-46, -190]], [[0, -390], [34, -290], [46, -190]]], hands: [[-46, -190], [46, -190]], look: "front", mood: "tired" },
          happy: { arms: [[[0, -400], [-40, -300], [-48, -205]], [[0, -400], [70, -452], [104, -540]]], hands: [[-48, -205], [104, -540]], look: "front", mood: "happy" },
        };
        for (const k in poses) {
          const P = poses[k], pg = G(inner, "pose-" + k);
          P.arms.forEach((a) => poly(pg, a));
          P.hands.forEach((h) => oval(pg, h, 14, 12, 0));
          if (k === "point") line(pg, [-188, -404], [-212, -410], { "stroke-width": 5 });
          head(pg, [k === "tired" ? 6 : 0, k === "tired" ? -462 : -470], 52, P.look, P.mood);
          pg.setAttribute("opacity", k === "think" ? 1 : 0);
        }
        txt(inner, 70, -560, "?", 90, JOINT, "middle", "host-q").setAttribute("opacity", 0);
      }

      // ---------- build scenes ----------
      const sc = (i) => T.scenes[i - 1];
      const sent = (i, k) => sc(i).sentences[k];
      function panel(svg, side, id) {
        const P = L.panels[side];
        return G(G(svg, null, `translate(${P[0]} ${P[1]}) scale(${P[2]})`), id);
      }
      function labels(svg, n) {
        ["easy", "hard"].forEach((side, i) => {
          const P = L.panels[i], g = G(svg, `s${n}-lab-${side}`, `translate(${P[0] + L.labelDx} ${P[1] + L.labelDy * P[2]})`);
          el(g, "rect", { x: -120, y: -42, width: 240, height: 76, rx: 38, fill: i ? HARD : EASY });
          txt(g, 0, 14, i ? "HARDER" : "EASIER", 40, "#fff");
        });
      }
      function title(svg, n, s) { txt(svg, L.title[0], L.title[1], s, L.titleFs, INK, "middle", `s${n}-title`); }

      // scene 2: backpack
      { const svg = document.getElementById("svg2");
        backpackFig(panel(svg, 0, "s2-p0"), false, "s2a"); backpackFig(panel(svg, 1, "s2-p1"), true, "s2b"); labels(svg, 2); }
      // scene 3: definition close-up (forearm angle animates)
      { const svg = document.getElementById("svg3");
        const g = G(svg, "s3-g", `translate(${L.def[0]} ${L.def[1]}) scale(${L.def[2]})`);
        const sh = [0, -470], elb = [0, -250];
        line(g, [0, -560], sh, { "stroke-width": 10 });
        line(g, sh, elb, { "stroke-width": 10 });
        const fore = el(g, "line", { x1: elb[0], y1: elb[1], stroke: INK, "stroke-width": 10, "stroke-linecap": "round", id: "s3-fore" });
        const db = G(g, "s3-db");
        dumbbell(db, [0, 0], 1.4);
        const pull = G(g, "s3-pull");
        const pl = el(pull, "line", { stroke: PULL, "stroke-width": 6, "stroke-dasharray": "16 12", id: "s3-pl" });
        const ph = el(pull, "path", { fill: PULL, id: "s3-ph" });
        const dl = el(g, "line", { stroke: DIST, "stroke-width": 14, "stroke-linecap": "round", id: "s3-dl" });
        el(g, "circle", { cx: elb[0], cy: elb[1], r: 18, fill: JOINT, stroke: "#fff", "stroke-width": 5, id: "s3-j" });
        const lj = txt(g, -40, elb[1] + 10, "joint", 44, JOINT, "end", "s3-lj");
        const lp = txt(g, 0, 0, "the weight's pull", 40, PULL, "start", "s3-lp");
        const ld = txt(g, 0, 0, "distance", 44, DIST, "start", "s3-ld");
        window.__s3 = (deg) => {
          const a = (deg * Math.PI) / 180, fl = 270;
          const hand = [elb[0] + fl * Math.sin(a), elb[1] + fl * Math.cos(a)];
          fore.setAttribute("x2", hand[0]); fore.setAttribute("y2", hand[1]);
          db.setAttribute("transform", `translate(${hand[0]} ${hand[1]})`);
          const top = elb[1] - 14, bot = Math.max(elb[1], hand[1]) + 100;
          pl.setAttribute("x1", hand[0]); pl.setAttribute("x2", hand[0]); pl.setAttribute("y1", top); pl.setAttribute("y2", bot - 20);
          ph.setAttribute("d", `M ${hand[0] - 18} ${bot - 30} L ${hand[0]} ${bot} L ${hand[0] + 18} ${bot - 30} Z`);
          dl.setAttribute("x1", elb[0]); dl.setAttribute("y1", elb[1]); dl.setAttribute("x2", hand[0]); dl.setAttribute("y2", elb[1]);
          lp.setAttribute("x", hand[0] + 26); lp.setAttribute("y", bot - 40);
          ld.setAttribute("x", elb[0] + 18); ld.setAttribute("y", elb[1] - 34);
        };
        window.__s3(28);
      }
      // scenes 4-6: exercise pairs
      { const svg = document.getElementById("svg4"); title(svg, 4, "BICEPS CURL");
        curlFig(panel(svg, 0, "s4-p0"), 26, "s4a"); curlFig(panel(svg, 1, "s4-p1"), 90, "s4b"); labels(svg, 4); }
      { const svg = document.getElementById("svg5"); title(svg, 5, "SIDE RAISE");
        raiseFig(panel(svg, 0, "s5-p0"), true, "s5a"); raiseFig(panel(svg, 1, "s5-p1"), false, "s5b"); labels(svg, 5); }
      { const svg = document.getElementById("svg6"); title(svg, 6, "SQUAT");
        squatFig(panel(svg, 0, "s6-p0"), false, "s6a"); squatFig(panel(svg, 1, "s6-p1"), true, "s6b"); labels(svg, 6); }
      // scene 7: takeaway + end card
      { const svg = document.getElementById("svg7");
        const g = G(svg, "s7-rule", `translate(${L.rule[0]} ${L.rule[1]})`);
        const r1 = G(g, "s7-r1"); el(r1, "rect", { x: -L.ruleW / 2, y: -70, width: L.ruleW, height: 110, rx: 30, fill: "#fdecec" });
        txt(r1, 0, 6, "Longer distance = harder", L.ruleFs, HARD);
        const r2 = G(G(g, null, "translate(0 150)"), "s7-r2"); el(r2, "rect", { x: -L.ruleW / 2, y: -70, width: L.ruleW, height: 110, rx: 30, fill: "#e8f6ee" });
        txt(r2, 0, 6, "Shorter distance = easier", L.ruleFs, EASY);
        const r3 = G(G(g, null, "translate(0 330)"), "s7-brand");
        txt(r3, 0, 0, "Local Tutors", L.ruleFs + 18, JOINT);
        txt(r3, 0, 56, "Learn with us!", 40, INK);
      }
      host(document.getElementById("hostsvg"));

      // captions
      const capsEl = document.getElementById("caps");
      CAPS.forEach((c, i) => { const d = document.createElement("div"); d.className = "cap"; d.id = "cap" + i; d.textContent = c.text; capsEl.appendChild(d); });

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });
      const pose = (name, at) => ["think", "point", "tired", "happy"].forEach((k) => tl.set("#pose-" + k, { opacity: k === name ? 1 : 0 }, at));
      const drawDist = (id, at) => { tl.to(`#${id}-dl`, { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.out" }, at); tl.to(`#${id}-sq`, { opacity: 1, duration: 0.2 }, at + 0.55); };
      const showPull = (id, at) => tl.fromTo(`#${id}-pull`, { opacity: 0 }, { opacity: 1, duration: 0.35 }, at);
      const pop = (sel, at) => tl.fromTo(sel, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(2.4)" }, at);
      const slideIn = (sel, at, dx) => tl.fromTo(sel, { x: dx, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, at);
      const pulse = (sel, at) => tl.to(sel, { scale: 1.12, transformOrigin: "50% 50%", duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, at);

      CAPS.forEach((c, i) => { tl.fromTo("#cap" + i, { opacity: 0 }, { opacity: 1, duration: 0.12 }, c.start); tl.to("#cap" + i, { opacity: 0, duration: 0.1 }, c.end - 0.1); });
      for (let i = 2; i <= 7; i++) tl.fromTo("#scene" + i + " svg", { opacity: 0 }, { opacity: 1, duration: 0.35 }, sc(i).start - 0.25);

      // host: slide in, idle bob, poses on cues
      tl.set("#host", { x: L.host[0] + L.hostIn, y: L.host[1], scale: L.host[2], svgOrigin: "0 0" }, 0);
      tl.to("#host", { x: L.host[0], duration: 0.8, ease: "power3.out" }, 0.2);
      tl.fromTo("#host-in", { y: 0 }, { y: -10, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: Math.floor((T.total - 1) / 1.0) - 1 }, 1.0);
      tl.fromTo("#host-q", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, sent(1, 1).start);
      tl.to("#host-q", { opacity: 0, duration: 0.2 }, sc(1).end - 0.3);
      tl.to("#host", { x: L.hostSide[0], y: L.hostSide[1], scale: L.hostSide[2], duration: 0.6, ease: "power2.inOut" }, sc(2).start - 0.3);

      // scene 2 backpack
      slideIn("#s2-p0", sent(2, 0).start, -60); showPull("s2a", sent(2, 0).start + 0.6); drawDist("s2a", sent(2, 0).start + 1.0);
      pop("#s2-lab-easy", sent(2, 1).start);
      slideIn("#s2-p1", sent(2, 2).start, 60); showPull("s2b", sent(2, 2).start + 0.6); drawDist("s2b", sent(2, 2).start + 1.0);
      pop("#s2-lab-hard", sent(2, 3).start); pose("tired", sent(2, 3).start);
      pose("point", sent(2, 5).start); pulse("#s2a-dist", sent(2, 5).start + 0.1); pulse("#s2b-dist", sent(2, 5).start + 0.3);

      // scene 3 definition
      pose("happy", sc(3).start);
      tl.fromTo("#s3-g", { opacity: 0 }, { opacity: 1, duration: 0.4 }, sc(3).start);
      ["#s3-lj", "#s3-lp", "#s3-ld", "#s3-pull", "#s3-dl"].forEach((s) => tl.set(s, { opacity: 0 }, 0));
      tl.to("#s3-lj", { opacity: 1, duration: 0.3 }, sent(3, 1).start + 0.6);
      tl.to(["#s3-pull", "#s3-lp"], { opacity: 1, duration: 0.3 }, sent(3, 1).start + 2.0);
      tl.to(["#s3-dl", "#s3-ld"], { opacity: 1, duration: 0.3 }, sent(3, 2).start + 0.4);
      pulse("#s3-ld", sent(3, 2).start + 1.4);
      const ang = { a: 28 };
      tl.to(ang, { a: 90, duration: 1.1, ease: "power2.inOut", onUpdate: () => window.__s3(ang.a) }, sent(3, 3).start);
      tl.to(ang, { a: 28, duration: 1.1, ease: "power2.inOut", onUpdate: () => window.__s3(ang.a) }, sent(3, 4).start);
      pose("point", sent(3, 3).start);

      // scenes 4-6: same choreography per exercise
      function pair(n, a, b, cues) {
        tl.fromTo(`#s${n}-title`, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4 }, sc(n).start);
        pose("think", sc(n).start);
        tl.fromTo([`#${a}-j`, `#${b}-j`], { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, cues.joint);
        pulse([`#${a}-j`, `#${b}-j`], cues.joint + 0.5);
        slideIn(`#s${n}-p0`, sc(n).start + 0.15, -60); showPull(a, cues.easyFig); drawDist(a, cues.easyDist);
        pop(`#s${n}-lab-easy`, cues.easyLab); pose("happy", cues.easyLab);
        slideIn(`#s${n}-p1`, sc(n).start + 0.35, 60); showPull(b, cues.hardFig); drawDist(b, cues.hardDist);
        pop(`#s${n}-lab-hard`, cues.hardLab); pose("tired", cues.hardLab);
      }
      // sentences: 0 title, 1 joint, 2 easy setup, 3 easy distance, 4 Easier, 5 hard setup, 6 hard distance, 7 Harder
      [4, 5, 6].forEach((n) => {
        const ab = { 4: ["s4a", "s4b"], 5: ["s5a", "s5b"], 6: ["s6a", "s6b"] }[n];
        const S = sc(n).sentences;
        // squat lines are "Stand tall, and the weight stays close." (setup+distance in one sentence)
        const cues = n === 6
          ? { joint: S[1].start, easyFig: S[1].end, easyDist: S[2].start + 0.6, easyLab: S[3].start, hardFig: S[3].end, hardDist: S[4].start + 0.9, hardLab: S[5].start }
          : { joint: S[1].start, easyFig: S[2].start, easyDist: S[3].start, easyLab: S[4].start, hardFig: S[5].start, hardDist: S[6].start, hardLab: S[7].start };
        pair(n, ab[0], ab[1], cues);
      });
      // hide overlay pieces before they are revealed
      ["s2a", "s2b", "s4a", "s4b", "s5a", "s5b", "s6a", "s6b"].forEach((id) => { tl.set(`#${id}-pull`, { opacity: 0 }, 0); tl.set(`#${id}-sq`, { opacity: 0 }, 0); });
      ["#s2-p0", "#s2-p1", "#s4-p0", "#s4-p1", "#s5-p0", "#s5-p1", "#s6-p0", "#s6-p1", "#s4-title", "#s5-title", "#s6-title"].forEach((s) => tl.set(s, { opacity: 0 }, 0));
      ["s4a", "s4b", "s5a", "s5b", "s6a", "s6b"].forEach((id) => tl.set(`#${id}-j`, { scale: 0, transformOrigin: "50% 50%" }, 0));
      [2, 4, 5, 6].forEach((n) => tl.set([`#s${n}-lab-easy`, `#s${n}-lab-hard`], { scale: 0, transformOrigin: "50% 50%" }, 0));

      // scene 7
      tl.to("#host", { x: L.hostEnd[0], y: L.hostEnd[1], scale: L.hostEnd[2], duration: 0.6, ease: "power2.inOut" }, sc(7).start - 0.3);
      pose("point", sc(7).start);
      ["#s7-r1", "#s7-r2", "#s7-brand"].forEach((s) => tl.set(s, { opacity: 0 }, 0));
      tl.fromTo("#s7-r1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4 }, sent(7, 0).start + 0.8);
      tl.fromTo("#s7-r2", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4 }, sent(7, 0).start + 2.4);
      tl.fromTo("#s7-brand", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(2)" }, sent(7, 1).start);
      pose("happy", sent(7, 2).start);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
